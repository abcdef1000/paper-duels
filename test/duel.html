<!doctype html>
<meta charset="utf-8">
<title>duel test</title>
<!-- Three game instances in iframes share an in-memory fake Firebase. They play a 3-question Race game,
     then a Bomb game to the end. Run via test/run.sh; the verdict is written into the "out" element. -->
<pre id="out">RUNNING</pre>
<iframe id="A" width="900" height="700"></iframe>
<iframe id="B" width="900" height="700"></iframe>
<iframe id="C" width="900" height="700"></iframe>
<script>
"use strict";
const log = [];
const out = m => { log.push(m); document.getElementById("out").textContent = log.join("\n"); };

/* ---- fake Firebase (only the calls the game uses) ---- */
const store = {};            // full path -> value
const listeners = [];        // {path, cb, query}
let nextId = 0, nextUid = 0;
const clone = v => v === undefined ? null : JSON.parse(JSON.stringify(v));
function snapOf(key, val) {
  return { key, val: () => clone(val), exists: () => val != null,
    forEach(fn) { if (val && typeof val === "object") for (const k of Object.keys(val)) fn(snapOf(k, val[k])); } };
}
function readPath(path) {
  if (path in store) return store[path];
  const kids = {}; let any = false;
  for (const [p, v] of Object.entries(store)) if (p.startsWith(path + "/") && !p.slice(path.length + 1).includes("/")) { kids[p.slice(path.length + 1)] = v; any = true; }
  return any ? kids : null;
}
function notify() { setTimeout(() => { for (const l of listeners.slice()) l.fire(); }, 5); }
function makeRef(path, q = {}) {
  const ref = {
    key: path.split("/").pop(),
    child: c => makeRef(path + "/" + c),
    push(v) { const r = makeRef(path + "/c" + (++nextId)); if (v !== undefined) r.set(v); return r; },
    set(v) {
      // a write below an existing entry (e.g. lobby/<id>/t) updates that entry in place
      const parent = Object.keys(store).find(k => path.startsWith(k + "/"));
      if (parent) {
        const parts = path.slice(parent.length + 1).split("/"); let o = store[parent];
        for (const p of parts.slice(0, -1)) o = o[p] = o[p] || {};
        if (v == null) delete o[parts[parts.length - 1]]; else o[parts[parts.length - 1]] = clone(v);
      } else if (v == null) delete store[path]; else store[path] = clone(v);
      notify(); return Promise.resolve();
    },
    remove() { return ref.set(null); },
    get() { return Promise.resolve(snapOf(ref.key, readPath(path))); },
    orderByChild(f) { return makeRef(path, { ...q, order: f }); },
    limitToLast(n) { return makeRef(path, { ...q, limit: n }); },
    onDisconnect() { return { remove: () => { ref._od = true; return Promise.resolve(); } }; },
    on(ev, cb) {
      if (path === ".info/connected") { setTimeout(() => cb(snapOf("connected", true)), 1); return cb; }
      const l = { cb, fire() { cb(snapOf(ref.key, readPath(path))); } };
      listeners.push(l); setTimeout(() => l.fire(), 1); return cb;
    },
    off(ev, cb) { const i = listeners.findIndex(l => l.cb === cb); if (i >= 0) listeners.splice(i, 1); },
  };
  return ref;
}
window.makeFakeFirebase = function () {
  let user = null;
  const auth = {
    onAuthStateChanged(cb) { setTimeout(() => cb(user), 1); return () => {}; },
    signInAnonymously() { user = { uid: "u" + (++nextUid), isAnonymous: true, displayName: null }; return Promise.resolve({ user }); },
    signOut() { return Promise.resolve(); },
  };
  const fb = { initializeApp() {}, auth: () => auth, database: () => ({ ref: p => makeRef(p) }) };
  fb.auth.GoogleAuthProvider = function () {};
  return fb;
};

/* ---- driver ---- */
const A = document.getElementById("A"), B = document.getElementById("B"), C = document.getElementById("C");
const F = { A, B, C };
const IW = new URLSearchParams(location.search).get("w");   // e.g. ?w=1400 tests the wide arena layout
if (IW) for (const f of [A, B, C]) f.width = IW;
const IH = new URLSearchParams(location.search).get("h");   // taller frames for screenshots
if (IH) for (const f of [A, B, C]) f.height = IH;
A.src = "site/index.html#duel";
setTimeout(() => { B.src = "site/index.html#duel"; }, 300);
setTimeout(() => { C.src = "site/index.html#duel"; }, 600);
const W = f => f.contentWindow, D = f => f.contentDocument;
const S = f => W(f).eval("S");
const btn = (f, text) => text === "Join" ? D(f).querySelector("#openlist button.port.docked:not(:disabled)") : [...D(f).querySelectorAll("button")].find(b => b.textContent.trim() === text && !b.disabled);
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, what, ms = 30000) {
  const t0 = Date.now();
  for (;;) { try { const v = fn(); if (v) return v; } catch {} if (Date.now() - t0 > ms) throw new Error("timeout waiting for " + what); await sleep(50); }
}
async function nameIfAsked(f, name) {
  await sleep(100);
  const inp = D(f).getElementById("nm-in");
  if (inp) { inp.value = name; btn(f, "Take a seat").click(); }
}
const curQ = f => { const s = S(f), g = s.match.g; return s.byId[g.qs[g.k % g.qs.length]]; };
function pick(f, correct) {
  const q = curQ(f);
  if (q.type === "short") {
    const inp = D(f).getElementById("sa-in");
    if (!inp || inp.disabled) throw new Error("no enabled answer box");
    inp.value = correct ? (q.answers ? q.answers[0] : String(q.num.value)) : "definitely wrong";
    btn(f, "Submit").click();
    return;
  }
  const target = correct ? q.a : (q.a + 1) % 4;
  const b = [...D(f).querySelectorAll("#matchbox .opt")].find(b => b.getAttribute("aria-label").endsWith(": " + q.o[target]) && !b.disabled);
  if (!b) throw new Error("no enabled option to click");
  b.click();
}
const rec = f => `W${W(f).eval("P.w")} L${W(f).eval("P.l")} D${W(f).eval("P.d")}`;
async function seatEveryone(hostOpens) {
  await until(() => btn(A, "Open room"), "A lobby");
  for (const f of [B, C]) await until(() => S(f).bank.length && S(f).roomState === "on", "lobby ready");
  hostOpens();
  btn(A, "Open room").click(); await nameIfAsked(A, "Ann");
  for (const [f, n] of [[B, "Ben"], [C, "Cy"]]) {
    const j = await until(() => btn(f, "Join"), "join button");
    j.click(); await nameIfAsked(f, n);
    await until(() => S(f).match, n + " seated");
  }
  (await until(() => btn(A, "Start with 3 players"), "start button")).click();
}
(async () => {
  try {
    /* ---------- ghost presence entries are hidden, then swept ---------- */
    store["lobby/ghostold"] = { by: "x1", p: JSON.stringify({ st: "host", nick: "Ghost", g: { id: "ghostroom", code: "GH0ST", mode: "race", pl: ["ghostold"], nm: ["Ghost"], qs: ["KIN-01"], n: 5, ph: "lobby", bk: "h2" } }), t: Date.now() - 10 * 60 * 1000 };
    store["lobby/ghostlegacy"] = { by: "x2", p: JSON.stringify({ st: "idle", nick: "Old tab" }) };
    notify();
    await until(() => [A, B, C].every(f => S(f).roomState === "on" && S(f).peers.length === 3), "3 live tabs counted", 30000);
    out(`ghosts: A counts ${S(A).peers.length} online (3 real tabs), ghost room listed: ${!!D(A).querySelector("#openlist .port.docked")}`);
    await until(() => !store["lobby/ghostold"] && !store["lobby/ghostlegacy"], "ghosts swept", 90000);
    out(`ghosts swept from the database; live tabs still ${S(A).peers.length}`);

    /* ---------- Race ---------- */
    await seatEveryone(() => { S(A).form.mode = "race"; S(A).form.n = 5; S(A).form.pool = "all"; W(A).eval("render()"); D(A).getElementById("rounds").value = "7"; D(A).getElementById("rounds").dispatchEvent(new Event("change")); [...D(A).querySelectorAll(".stepper button")].find(b => b.getAttribute("aria-label") === "One fewer").click(); D(A).querySelectorAll(".stepper button")[0].click(); });
    out(`race: 3 seated, names ${JSON.stringify(S(A).match.g.nm)}, length ${S(A).match.g.n} with ${S(A).match.g.qs.length} questions drawn`);
    // [A, B, C] in click order; "r" right, "w" wrong
    const plan = [[["A","r"],["B","w"],["C","r"]], [["A","w"],["B","w"],["C","w"]], [["B","w"],["A","w"],["C","r"]], [["C","r"],["A","r"],["B","r"]], [["B","r"],["A","w"],["C","w"]]];   // length 7 - 2 = 5
    for (let i = 0; i < plan.length; i++) {
      await until(() => [A, B, C].every(f => S(f).match.g.ph === "q" && S(f).match.g.k === i && D(f).querySelector("#matchbox .opt, #matchbox #sa-in")), "race q" + i);
      if (i === 0) {   // first answer right: red 8 s for the rest, and everyone is told
        pick(A, true);
        await until(() => D(C).querySelector("#vignette.on:not(.yellow)") && /Ann got it right/.test(D(B).getElementById("cutcount").textContent), "red clock on B and C", 8000);
        out(`  first answer right: B reads "${D(B).getElementById("cutcount").textContent}", red vignette on C ${!!D(C).querySelector("#vignette.on:not(.yellow)")}, on A ${!!D(A).querySelector("#vignette.on")}; A reads "${D(A).getElementById("cutcount").textContent}"`);
        await sleep(120); pick(B, false); await sleep(120); pick(C, true);
      } else if (i === 1) {   // first answer wrong: yellow 15 s
        pick(A, false);
        await until(() => D(B).querySelector("#vignette.on.yellow") && D(C).querySelector("#vignette.on.yellow"), "yellow clock on B and C", 8000);
        out(`  first answer wrong: B reads "${D(B).getElementById("cutcount").textContent}", yellow on B ${!!D(B).querySelector("#vignette.on.yellow")}, on C ${!!D(C).querySelector("#vignette.on.yellow")}`);
        await sleep(120); pick(B, false); await sleep(120); pick(C, false);
      } else for (const [who, how] of plan[i]) { pick(F[who], how === "r"); await sleep(120); }
      await until(() => [A, B, C].every(f => S(f).match.g.ph === "r"), "race reveal " + i, 100000);
      const g = S(A).match.g;
      out(`  Q${i + 1} ${plan[i].map(x => x.join(":")).join(" ")} -> winner seat ${g.res.w}, scores ${g.sc.join("-")}` + (i === 0 ? `; picks shown: ${[...D(B).querySelectorAll("#matchbox .pick")].map(e => e.textContent).join(", ")}` : ""));
      const label = i < plan.length - 1 ? "Next question" : "See results";
      for (const f of [A, B, C]) (await until(() => btn(f, label), "next"))?.click();
    }
    await until(() => [A, B, C].every(f => S(f).match.ended), "race end");
    out(`  make-a-pack prompt after the game: A ${!!D(A).querySelector(".packcta")}, B ${!!D(B).querySelector(".packcta")}`);
    out("  final " + S(A).match.g.sc.join("-") + " | " + ["A","B","C"].map(n => `${n} sees "${D(F[n]).querySelector(".status").textContent}"`).join(" | "));
    out(`  records A ${rec(A)} · B ${rec(B)} · C ${rec(C)}`);
    for (const f of [A, B, C]) btn(f, "Back to lobby").click();

    /* ---------- Bomb ---------- */
    await seatEveryone(() => { S(A).form.mode = "bomb"; S(A).form.lives = 1; S(A).form.fuse = 20; S(A).form.pool = "quick"; });
    out("bomb: 3 seated, 1 life each, 20 s fuse");
    const turns = { Ann: 0, Ben: 0, Cy: 0 };
    let lastK = -1;
    for (let t = 0; t < 20; t++) {
      await until(() => S(A).match.g.ph === "end" || (S(A).match.g.ph === "q" && S(A).match.g.k !== lastK && [A, B, C].every(f => S(f).match.g.k === S(A).match.g.k && S(f).match.g.ph === "q")), "bomb turn", 100000);
      const g = S(A).match.g;
      if (g.ph === "end") break;
      lastK = g.k;
      const holderName = g.nm[g.turn];
      const hf = [A, B, C].find(f => S(f).myPeer === g.pl[g.turn]);
      turns[holderName]++;
      let action;
      if (holderName === "Ben") action = "wrong";
      else if (holderName === "Cy") action = turns.Cy >= 2 ? "timeout" : "right";
      else action = "right";
      await sleep(200);
      // non-holders must not be able to answer
      const others = [A, B, C].filter(f => f !== hf);
      const blocked = others.every(f => [...D(f).querySelectorAll("#matchbox .opt, #matchbox #sa-in")].every(b => b.disabled));
      if (action !== "timeout") pick(hf, action === "right");
      await until(() => S(A).match.g.ph === "r" || S(A).match.g.ph === "end", "bomb result", 100000);
      const r = S(A).match.g;
      out(`  turn ${t + 1}: ${holderName} ${action} -> ${r.res && r.res.boom ? "BOOM" : "passed"}, lives ${r.lv.join("-")}, others blocked: ${blocked}`);
    }
    await until(() => [A, B, C].every(f => S(f).match.ended), "bomb end", 100000);
    const gb = S(A).match.g;
    out(`  winner ${gb.nm[gb.win]} | A sees "${D(A).querySelector(".status").textContent}" | B sees "${D(B).querySelector(".status").textContent}"`);
    out(`  records A ${rec(A)} · B ${rec(B)} · C ${rec(C)}`);
    for (const f of [A, B, C]) btn(f, "Back to lobby").click();

    /* ---------- short-answer race round + answer matching ---------- */
    await until(() => btn(A, "Open room"), "A lobby again");
    S(A).form.mode = "race"; S(A).form.n = 5;
    btn(A, "Open room").click();
    for (const f of [B, C]) { (await until(() => btn(f, "Join"), "join")).click(); await until(() => S(f).match, "seated"); }
    await until(() => S(A).match.g.pl.length === 3, "3 seated");
    W(A).eval('setG({ qs: ["KIN-05"], n: 1 })');
    (await until(() => btn(A, "Start with 3 players"), "start")).click();
    await until(() => [A, B, C].every(f => S(f).match.g.ph === "q" && D(f).getElementById("sa-in")), "short question shown");
    out(`chat open during question: ${[A, B, C].every(f => !D(f).getElementById("chat-in").disabled)}`);
    const type = (f, v) => { D(f).getElementById("sa-in").value = v; btn(f, "Submit").click(); };
    type(C, "30");
    await until(() => D(C).getElementById("thinking") && /Ann and Ben are thinking/.test(D(C).getElementById("thinking").textContent), "C sees who is thinking", 10000);
    const t1 = D(C).getElementById("thinking").textContent;
    await sleep(120); type(B, "25 m");
    await until(() => /^Ann is thinking/.test(D(C).getElementById("thinking") ? D(C).getElementById("thinking").textContent : ""), "C sees only Ann thinking", 10000);
    out(`thinking line on C: "${t1}" then "${D(C).getElementById("thinking").textContent}"`);
    await sleep(120); type(A, "25");
    await until(() => S(A).match.g.ph === "r", "short reveal", 100000);
    const gs = S(A).match.g;
    out(`short race: C "30", B "25 m", A "25" -> winner ${gs.nm[gs.res.w]}, picks ${JSON.stringify(gs.res.c)}`);
    const chk = (q, r) => W(A).eval("isCorrect")(q, r);
    const numQ = { type: "short", num: { value: 2.4, tol: 0.05, unit: "V" } }, txtQ = { type: "short", answers: ["Hess's law"] }, o2 = { type: "short", answers: ["oxygen", "O2"] };
    const cases = [[numQ, "2.4 V", true], [numQ, "2.40", true], [numQ, "2.5", false], [numQ, "", false], [txtQ, "hess’s LAW.", true], [txtQ, "Boyle's law", false], [o2, "O₂", true], [{ a: 2 }, 2, true], [{ a: 2 }, 1, false]];
    const bad = cases.filter(([q, r, want]) => chk(q, r) !== want);
    out(`answer matching: ${cases.length - bad.length}/${cases.length} cases right` + (bad.length ? " FAILED " + JSON.stringify(bad) : ""));
    for (const f of [A, B, C]) (await until(() => btn(f, "See results"), "see results")).click();
    await until(() => [A, B, C].every(f => S(f).match.ended), "short race end", 100000);
    const oldId = S(A).match.g.id;
    btn(A, "Rematch with this crew").click();
    await until(() => [B, C].every(f => S(f).match && !S(f).match.ended && S(f).match.g.id === S(A).match.g.id && S(f).match.g.ph === "lobby"), "crew follows rematch", 30000);
    await sleep(3500);   // past the captain's 2.5 s seat-cleanup window
    out(`how to play on the waiting screen: ${[...D(B).querySelectorAll(".howto li b")].map(e => e.textContent).join(" / ")}`);
    const annSeat = [...D(B).querySelectorAll(".seat")].find(se => se.querySelector(".sn").textContent === "Ann");
    annSeat.querySelector(".av").click();
    out(`tap Ann's sprite: flips ${annSeat.querySelector(".av").classList.contains("flip")}, chat box reads "${D(B).getElementById("chat-in").value}", focused ${D(B).activeElement === D(B).getElementById("chat-in")}`);
    D(B).getElementById("chat-in").value = "";
    (await until(() => [...D(B).querySelectorAll(".chat .quick button")].find(x => x.textContent === "gg" && !x.disabled), "B quick chat")).click();
    D(C).getElementById("chat-in").value = "rematch time <b>bold?</b>"; D(C).querySelector(".chatform button").click();
    await until(() => D(A).querySelectorAll(".chatlog li:not(.empty)").length >= 2, "A sees chat", 15000);
    out(`chat on A: ${[...D(A).querySelectorAll(".chatlog li")].map(li => li.textContent).join(" | ")}; carried rematch chat id: ${S(A).match.g.chat === oldId}`);
    const cid = S(A).chat.cid;
    for (let i = 0; i < 40; i++) store[`chat/${cid}/z${String(i).padStart(2, "0")}`] = { by: "x", nick: "Spam", text: "message " + i, t: Date.now() + i };
    notify();
    await until(() => D(A).querySelectorAll(".chatlog li").length >= 40, "40 messages", 10000);
    W(A).eval("renderMatch()"); await sleep(200);
    const log = D(A).querySelector(".chatlog");
    out(`chat with 40+ messages after a re-render: pinned to the newest ${log.scrollHeight - log.scrollTop - log.clientHeight < 2} (last visible: "${log.lastElementChild.textContent}")`);
    await sleep(500); log.scrollTop = 150; log.dispatchEvent(new Event("scroll")); W(A).eval("renderMatch()"); await sleep(200);
    out(`after scrolling up to read: kept the reader's place ${Math.abs(D(A).querySelector(".chatlog").scrollTop - 150) < 3}`);
    out(`rematch: new room ${S(A).match.g.id !== oldId ? "created" : "NOT created"}, seated ${S(A).match.g.pl.length}/3, B and C followed: ${[B, C].every(f => S(f).match.g.id === S(A).match.g.id)}`);
    btn(A, "Close room").click(); btn(A, "Close room for everyone?").click();
    await until(() => [B, C].every(f => !S(f).match), "crew back in lobby", 30000);
    out(`closed: B sees "${S(B).lobbyMsg}"`);

    /* ---------- player-made pack: AI reply -> validate -> save -> host -> others join ---------- */
    const aiPack = { name: "Sec 3 Acids", questions: [
      { id: "AC-1", topic: "pH", type: "mcq", q: "What is the pH of pure water at 25 °C?", o: ["0", "7", "14", "1"], a: 1, x: "Pure water is neutral, pH 7.", d: 1, quick: true },
      { id: "AC-2", topic: "Neutralisation", type: "short", q: "Name the salt formed when hydrochloric acid reacts with sodium hydroxide.", answers: ["sodium chloride", "NaCl"], x: "HCl + NaOH → NaCl + H2O.", quick: true },
      { id: "AC-3", topic: "pH", type: "mcq", q: "Which has the lowest pH?", o: ["soap", "lemon juice", "water", "milk"], a: 1, x: "Lemon juice is acidic.", d: 2, fig: "<svg></svg>" } ] };
    const reply = "Here you go!\n```json\n" + JSON.stringify(aiPack, null, 2) + "\n```\nHope this helps.";
    const res = W(A).eval("validatePack")(W(A).eval("extractJson")(reply));
    out(`pack check: ${res.errors.length} errors, ${res.warnings.length} warnings, sections ${JSON.stringify(res.pack.sections)}, AC-2 d=${res.pack.questions[1].d}, fig kept: ${"fig" in res.pack.questions[2]}`);
    const bad1 = W(A).eval("validatePack")({ questions: [{ q: "x?", o: ["a", "b"], a: 0 }] });
    out(`broken pack rejected: ${bad1.errors.length > 0} (${bad1.errors[0]})`);
    const pid = await W(A).eval("savePack")(res.pack, true);
    out(`saved pack ${pid}; stored: ${!!store["packData/" + pid]} meta: ${!!store["packMeta/" + pid]}`);
    W(A).eval(`setSubject("pk:${pid}")`);
    delete W(B).eval("S").banks["pk:" + pid];                 // B starts without the pack
    /* ---------- room code + invite link with name prompt ---------- */
    await until(() => btn(A, "Open room"), "A lobby (code)");
    btn(A, "Open room").click();
    await until(() => S(A).match && S(A).match.g.code, "room code");
    const code = S(A).match.g.code;
    W(B).eval("S.named = false"); W(B).sessionStorage.removeItem("p1d.named");
    W(B).location.hash = "room-" + code;
    await until(() => D(B).getElementById("nm-in"), "B asked for a name", 15000);
    D(B).getElementById("nm-in").value = "Benny"; btn(B, "Take a seat").click();
    await until(() => S(B).match && S(B).match.g.code === code, "B joined by link", 15000);
    await until(() => S(A).match.g.nm.includes("Benny"), "host sees Benny", 15000);
    out(`invite link: code ${code}, B prompted for a name and joined as ${JSON.stringify(S(A).match.g.nm)}, hash now "${W(B).location.hash}"`);
    W(C).location.hash = "room-ZZZZ9";
    await until(() => /isn't open/.test(S(C).lobbyMsg || ""), "C told the room is closed", 20000);
    out(`bad code: C sees "${S(C).lobbyMsg}"`);
    btn(A, "Close room").click(); btn(A, "Close room for everyone?").click();
    await until(() => !S(B).match, "B back in lobby", 15000);
    S(C).cfg.notify = true; W(C).location.hash = "practice";
    const sfxErrors = W(A).eval('(() => { const c = ac(); const bad = []; for (const [k, e] of Object.entries(SFX)) { try { e.play(c); } catch (err) { bad.push(k + ": " + err.message); } } return bad; })()');
    out(`sound effects: ${W(A).eval("Object.keys(SFX).length")} synthesised, errors: ${sfxErrors.length ? JSON.stringify(sfxErrors) : "none"}`);
    await until(() => btn(A, "Open room"), "A lobby (pack)");
    S(A).form.mode = "race"; S(A).form.n = 5; S(A).form.pool = "all";
    W(A).eval("render()");
    btn(A, "Open room").click();
    (await until(() => btn(B, "Join"), "B sees pack room", 30000)).click();
    await until(() => D(C).getElementById("toast"), "C gets a new-room alert", 15000);
    out(`new-room alert on C (in Practice): "${D(C).getElementById("toast").textContent.replace(/Go to lobby|Dismiss/g, "").trim()}"`);
    await until(() => S(B).match, "B seated in pack room");
    out(`B loaded pack for room: ${!!S(B).banks["pk:" + pid]}; room subject ${S(A).match.g.bk}`);
    (await until(() => btn(A, "Start with 2 players"), "start pack game")).click();
    await until(() => [A, B].every(f => S(f).match.g.ph === "q" && (D(f).querySelector("#matchbox .opt") || D(f).getElementById("sa-in"))), "pack question");
    const pq = curQ(B);
    if (pq.type === "short") { D(B).getElementById("sa-in").value = pq.answers[0]; btn(B, "Submit").click(); } else pick(B, true);
    await until(() => S(A).match.g.ph === "r", "pack reveal", 100000);
    out(`pack round: ${pq.id} (${pq.type}) -> winner ${S(A).match.g.nm[S(A).match.g.res.w]}`);
    out("players docs: " + Object.keys(store).filter(k => k.startsWith("players/")).length);
    out("DONE");
  } catch (e) { out("FAIL: " + e.message); }
})();
</script>
