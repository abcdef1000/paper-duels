<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paper One Duel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27 shape-rendering=%27crispEdges%27%3E%3Crect width=%278%27 height=%278%27 fill=%27%230B0E24%27/%3E%3Crect x=%272%27 y=%271%27 width=%274%27 height=%276%27 fill=%27%23FF7A45%27/%3E%3Crect x=%271%27 y=%272%27 width=%276%27 height=%274%27 fill=%27%23FF7A45%27/%3E%3Crect x=%273%27 y=%273%27 width=%272%27 height=%272%27 fill=%27%23FFD166%27/%3E%3C/svg%3E">
<meta name="description" content="Orbit Station: a pixel-art party quiz for H2 Physics, PSLE Science and PSLE Maths. Race or pass the Hot Core with 2–8 crew, take the Daily Test, practise and track progress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Orbit Station: a pixel-art space station. Deep-space background with a pixel starfield, panels with notched
   pixel borders, crew drawn as 10×10 astronaut helmets, the bomb is a flickering reactor core.
   Deliberately one dark theme: it is space. */
:root {
  --space: #0B0E24;         /* page */
  --panel: #141938;         /* sheets */
  --panel2: #1C2250;        /* inset areas */
  --line: #2E3672;          /* pixel borders */
  --ink: #E8ECFF;
  --muted: #8C96C4;
  --accent: #5EEAD4;        /* station teal */
  --core: #FF7A45;          /* the hot core */
  --gold: #FFD166;
  --good: #7CE678;
  --bad: #FF5C7A;
  --real: #1FAF9C;          /* chart: real players */
  --sim: #8C7FD9;           /* chart: simulated players */
  --s0: #5EEAD4; --s1: #FFD166; --s2: #FF7A45; --s3: #C49BF5; --s4: #7CE678; --s5: #FF5C7A; --s6: #78AAFF; --s7: #E6E6F0;
  --display: "Press Start 2P", "Courier New", monospace;
  --label: "Silkscreen", "Courier New", monospace;
  --body: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --px: 4px;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0; background: var(--space); color: var(--ink); font: 17px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
/* pixel starfield */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(var(--ink), var(--ink)), linear-gradient(var(--ink), var(--ink)), linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--accent), var(--accent)), linear-gradient(var(--ink), var(--ink)), linear-gradient(var(--muted), var(--muted)),
    linear-gradient(var(--muted), var(--muted)), linear-gradient(var(--ink), var(--ink));
  background-size: 3px 3px, 2px 2px, 3px 3px, 2px 2px, 2px 2px, 2px 2px, 3px 3px, 2px 2px;
  background-repeat: no-repeat;
  background-position: 8% 12%, 23% 70%, 41% 22%, 63% 81%, 77% 9%, 88% 48%, 14% 92%, 52% 55%;
  opacity: .7;
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(var(--muted) 1px, transparent 1.5px);
  background-size: 97px 89px; opacity: .25;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.wrap { max-width: 1060px; margin: 0 auto; }

/* masthead */
.mast { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 24px; padding-block: 26px 16px; border-bottom: 4px solid var(--line); }
.brand { display: flex; flex-direction: column; gap: 10px; }
.brand small { font: 400 12px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.brand h1 { margin: 0; font: 400 clamp(20px, 4.2vw, 34px)/1.15 var(--display); letter-spacing: 0; color: var(--ink); text-shadow: 3px 3px 0 var(--core); text-wrap: balance; }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.who label { font: 400 12px/1 var(--label); text-transform: uppercase; color: var(--muted); }
.who input { width: 11em; padding: 7px 10px; border: 0; background: var(--panel2); }
nav.tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 16px; }
nav.tabs a { padding: 8px 12px; text-decoration: none; color: var(--muted); font: 700 13px/1 var(--label); text-transform: uppercase; white-space: nowrap; }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--space); box-shadow: 0 -4px 0 0 var(--accent), 0 4px 0 0 var(--accent), -4px 0 0 0 var(--accent), 4px 0 0 0 var(--accent); }
nav.tabs a:hover:not([aria-current]) { color: var(--ink); }
.subj { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 400 12px/1 var(--label); text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.subj select { font: 600 15px/1.2 var(--body); text-transform: none; }

/* panels with a notched pixel border */
.sheet { background: var(--panel); padding: 20px; min-width: 0; margin: var(--px); box-shadow: 0 -4px 0 0 var(--line), 0 4px 0 0 var(--line), -4px 0 0 0 var(--line), 4px 0 0 0 var(--line); }
.eyebrow { font: 400 12px/1.3 var(--label); text-transform: uppercase; color: var(--accent); margin: 0 0 8px; letter-spacing: .04em; }
h2 { font: 400 clamp(15px, 2.6vw, 19px)/1.4 var(--display); margin: 0 0 14px; text-wrap: balance; }
h3 { font: 700 15px/1.3 var(--label); text-transform: uppercase; margin: 0 0 8px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.note { font-size: 14px; color: var(--muted); }
.banner { padding: 10px 14px; background: var(--panel2); border-left: 6px solid var(--gold); color: var(--ink); font-size: 15px; margin-bottom: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.spread { justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font: 400 11px/1 var(--label); text-transform: uppercase; color: var(--muted); }
select, .field input { padding: 8px 10px; border: 0; background: var(--panel2); min-width: 0; max-width: 100%; box-shadow: inset 0 -3px 0 var(--line); }
.btn { appearance: none; border: 0; background: var(--core); color: var(--space); padding: 10px 16px; font: 700 14px/1 var(--label); text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-block;
  box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.22); }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(2px); box-shadow: inset 4px 4px 0 rgba(0,0,0,.28); }
.btn.ghost { background: var(--panel2); color: var(--ink); }
.btn.teal { background: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.btn.small { padding: 7px 11px; font-size: 12px; }
.btn.danger { background: var(--bad); color: var(--space); }

/* mode picker */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; border: 0; padding: 0; margin: 0; }
@media (max-width: 460px) { .modes { grid-template-columns: 1fr; } }
.mode { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--panel2); cursor: pointer; }
.mode input { position: absolute; opacity: 0; pointer-events: none; }
.mode b { font: 400 13px/1.3 var(--display); }
.mode span { font-size: 14px; color: var(--muted); line-height: 1.4; }
.mode:has(input:checked) { background: #2A2160; box-shadow: 0 -4px 0 0 var(--core), 0 4px 0 0 var(--core), -4px 0 0 0 var(--core), 4px 0 0 0 var(--core); }
.mode:has(input:focus-visible) { outline: 3px solid var(--gold); outline-offset: 6px; }

/* lobby */
.lobby-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lobby-list li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 3px dotted var(--line); }
.lobby-list li:first-child { border-top: 0; }
.lobby-list .who-col { flex: 1; min-width: 0; }
.lobby-list .nm { font-weight: 600; overflow-wrap: anywhere; }
.tag { font: 700 11px/1 var(--label); text-transform: uppercase; padding: 3px 6px; background: var(--core); color: var(--space); margin-right: 8px; vertical-align: 2px; }
.tag.race { background: var(--accent); }
.empty { padding: 18px; border: 3px dashed var(--line); color: var(--muted); font-size: 15px; }
.blink { animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

/* the round table */
.table { position: relative; width: min(100%, 400px); aspect-ratio: 1; margin: 6px auto 10px; }
.table::before { content: ""; position: absolute; inset: 17%; border-radius: 50%; border: 4px dotted var(--line); }
.seat { position: absolute; transform: translate(-50%, -50%); width: 96px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; transition: left .4s steps(6), top .4s steps(6); }
.av { --c: var(--s0); position: relative; width: 56px; height: 56px; display: grid; place-items: center; transition: transform .2s steps(3); }
.av svg { width: 100%; height: 100%; image-rendering: pixelated; }
.seat.holder .av { transform: scale(1.2); }
.seat.holder .av::after { content: ""; position: absolute; inset: -8px; border: 4px dashed var(--core); animation: spin 2s steps(8) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.seat.out { opacity: .35; filter: grayscale(1); }
.seat.gone .av { opacity: .4; }
.sn { font: 700 12px/1.2 var(--label); max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; }
.seat.me .sn { color: var(--gold); }
.sb { font: 500 13px/1.2 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.sb.hearts { color: var(--bad); letter-spacing: .1em; }
.mark { position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px; display: grid; place-items: center; font: 700 12px/1 var(--label); background: var(--panel); color: var(--ink); box-shadow: 0 0 0 3px var(--line); }
.mark.lock { color: var(--c); box-shadow: 0 0 0 3px var(--c); }
.mark.ok { background: var(--good); color: var(--space); box-shadow: none; }
.mark.no { background: var(--bad); color: var(--space); box-shadow: none; }
@media (max-width: 480px) { .seat { width: 74px; } .av { width: 44px; height: 44px; } .sn { max-width: 74px; font-size: 11px; } }
.hub { position: absolute; left: 50%; top: 50%; width: 42%; aspect-ratio: 1; transform: translate(-50%, -50%); display: grid; place-items: center; text-align: center; }
.hub > * { grid-area: 1 / 1; }
.hub .ring { width: 100%; height: 100%; }
.hub .ring rect { fill: var(--line); }
.hub .ring rect.on { fill: var(--accent); }
.hub.hot .ring rect.on { fill: var(--core); }
.hub .big { font: 400 clamp(20px, 6vw, 30px)/1 var(--display); color: var(--gold); }
.hub .lbl { font: 400 11px/1.4 var(--label); color: var(--muted); text-transform: uppercase; margin-top: 6px; }
.pointer { width: 100%; height: 100%; transition: transform .5s steps(8); }
.pointer::after { content: ""; position: absolute; right: -12px; top: 50%; width: 12px; height: 12px; transform: translateY(-50%); background: var(--core); box-shadow: 4px 0 0 var(--core), -4px -4px 0 var(--core), -4px 4px 0 var(--core); }
.corepx { width: 58%; height: 58%; image-rendering: pixelated; animation: flick .5s steps(2) infinite; }
@keyframes flick { 50% { filter: brightness(1.25); } }
.hub.urgent .corepx { animation: shake .16s steps(2) infinite; }
@keyframes shake { 50% { transform: translate(3px, -2px); } }
.hub.boom .corepx { animation: none; filter: hue-rotate(-40deg) saturate(1.6); }
.hub .count { position: absolute; bottom: 4%; font: 700 13px/1 var(--label); color: var(--core); font-variant-numeric: tabular-nums; }

/* question card */
.panel { display: flex; flex-direction: column; gap: 14px; }
.status { font: 400 clamp(12px, 2.3vw, 15px)/1.5 var(--display); }
.status.win { color: var(--good); } .status.lose { color: var(--bad); }
.qcard { display: flex; flex-direction: column; gap: 14px; }
.qhead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
.qid { font: 700 13px/1 var(--label); color: var(--gold); }
.qtopic { font: 400 13px/1.2 var(--label); color: var(--muted); text-transform: uppercase; }
.stem { font-size: 19px; line-height: 1.55; margin: 0; max-width: 66ch; }
.opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.opt { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; padding: 10px 14px 10px 10px; border: 0; background: var(--panel2); cursor: pointer; font-size: 17px;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.3); }
.opt:hover:not(:disabled) { background: #2A3172; }
.opt:disabled { cursor: default; }
.bubble { width: 32px; height: 32px; display: grid; place-items: center; font: 400 12px/1 var(--display); color: var(--accent); background: var(--space); box-shadow: 0 0 0 3px var(--accent); }
.opt.mine .bubble { background: var(--gold); color: var(--space); box-shadow: 0 0 0 3px var(--gold); }
.opt.correct { background: #1E4A3A; }
.opt.correct .bubble { color: var(--good); box-shadow: 0 0 0 3px var(--good); }
.opt.correct.mine .bubble { background: var(--good); color: var(--space); }
.opt.wrong { background: #4A1E33; }
.opt.wrong .bubble { background: var(--bad); color: var(--space); box-shadow: 0 0 0 3px var(--bad); }
.otext { overflow-wrap: anywhere; }
.marks { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.chip { --c: var(--s0); font: 700 11px/1 var(--label); padding: 4px 6px; white-space: nowrap; background: var(--c); color: var(--space); }
.explain { border-left: 6px solid var(--good); padding: 10px 14px; background: var(--panel2); }
.explain.badx { border-left-color: var(--bad); }
.explain p:last-child { margin: 0; }
details.data { font-size: 14px; color: var(--muted); }
details.data summary { cursor: pointer; font: 400 12px/1 var(--label); text-transform: uppercase; }
.timer { height: 12px; background: var(--panel2); }
.timer i { display: block; height: 100%; width: 100%; background: repeating-linear-gradient(90deg, var(--core) 0 10px, transparent 10px 12px); transition: width .25s steps(2); }

/* figures (inline SVG from the question banks) */
.fig { color: var(--ink); margin: 0; padding: 12px; background: var(--panel2); align-self: flex-start; width: 100%; max-width: 440px; }
.fig svg { display: block; width: 100%; height: auto; }
.fig line, .fig path, .fig polyline, .fig .hollow { stroke: currentColor; stroke-width: 1.5; fill: none; }
.fig .solid, .fig .hd { fill: currentColor; stroke: none; }
.fig .ac { stroke: var(--core); }
.fig .hd.ac, .fig .acf { fill: var(--core); stroke: none; }
.fig .thick { stroke-width: 3; }
.fig .guide { stroke: var(--muted); stroke-dasharray: 4 4; }
.fig .guide.solidline { stroke-dasharray: none; }
.fig .hd.guide, .fig .hd.dim { fill: var(--muted); }
.fig .dash { stroke-dasharray: 5 4; }
.fig .dim { stroke: var(--muted); stroke-width: 1; }
.fig text { fill: currentColor; stroke: none; font: 13px var(--body); }
.fig text.muted { fill: var(--muted); }
.fig text.acfill { fill: var(--core); font-weight: 700; font-size: 15px; }

/* standings */
.standings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.standings li { display: grid; grid-template-columns: 2em 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; background: var(--panel2); }
.standings li.first { background: #1E4A3A; }
.standings .pos { font: 400 12px/1 var(--display); color: var(--gold); }
.standings .av { width: 36px; height: 36px; }
.standings .pn { font-weight: 600; overflow-wrap: anywhere; }
.standings .pv { font: 700 13px/1 var(--label); }

/* name prompt */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(11, 14, 36, .82); }
.modal form { width: min(440px, 100%); display: flex; flex-direction: column; gap: 14px; }
.modal input { font-size: 20px; padding: 10px 12px; border: 0; background: var(--panel2); box-shadow: inset 0 -4px 0 var(--accent); }

/* progress */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-bottom: 18px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.stat { background: var(--panel); padding: 14px; box-shadow: 0 -4px 0 0 var(--line), 0 4px 0 0 var(--line), -4px 0 0 0 var(--line), 4px 0 0 0 var(--line); margin: var(--px); }
.stat b { display: block; font: 400 clamp(15px, 3vw, 20px)/1.3 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.stat span { font: 400 11px/1.3 var(--label); text-transform: uppercase; color: var(--muted); }
.sec { margin-bottom: 18px; }
.sec h3 { display: flex; justify-content: space-between; gap: 10px; border-bottom: 4px solid var(--line); padding-bottom: 6px; color: var(--accent); }
.sec h3 small { font: 400 12px/1.4 var(--label); color: var(--muted); }
.trow { display: grid; grid-template-columns: minmax(0, 14em) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 3px dotted var(--line); }
@media (max-width: 560px) { .trow { grid-template-columns: minmax(0,1fr) auto; } .trow .ovals { grid-column: 1 / -1; } }
.trow .tn { font-size: 15px; overflow-wrap: anywhere; }
.ovals { display: flex; flex-wrap: wrap; gap: 8px; }
.oval { width: 26px; height: 26px; border: 0; background: var(--space); color: var(--muted); font: 700 10px/1 var(--label); cursor: pointer; padding: 0; box-shadow: 0 0 0 3px var(--line); }
.oval.ok { background: var(--accent); color: var(--space); box-shadow: 0 0 0 3px var(--accent); }
.oval.no { background: #4A1E33; color: var(--bad); box-shadow: 0 0 0 3px var(--bad); }
.oval:hover { transform: translateY(-2px); }
.tpct { font: 700 12px/1 var(--label); color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: var(--muted); align-items: center; margin-bottom: 14px; }
.legend .oval { cursor: default; width: 18px; height: 18px; vertical-align: middle; margin-right: 6px; }

/* daily test */
.dq-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.tier { font: 700 12px/1 var(--label); text-transform: uppercase; color: var(--gold); }
.tier i { display: inline-block; width: 10px; height: 10px; margin-right: 3px; background: var(--line); }
.tier i.on { background: var(--gold); }
.worth { font: 700 13px/1 var(--label); color: var(--core); font-variant-numeric: tabular-nums; }
.steps { display: flex; gap: 8px; }
.steps span { width: 34px; height: 10px; background: var(--line); }
.steps span.done { background: var(--accent); }
.steps span.now { background: var(--gold); }
.breakdown { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.breakdown li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; background: var(--panel2); }
.breakdown .pts { font: 400 12px/1 var(--display); color: var(--gold); }
.headline { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: end; }
.headline .score { font: 400 clamp(28px, 7vw, 44px)/1 var(--display); color: var(--gold); text-shadow: 3px 3px 0 var(--core); }
.headline .facts { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.headline .facts b { display: block; font: 400 14px/1.4 var(--display); color: var(--ink); }
.headline .facts span { font: 400 11px/1.2 var(--label); text-transform: uppercase; color: var(--muted); }
.chartwrap { position: relative; overflow-x: auto; }
.chart { width: 100%; min-width: 520px; height: auto; display: block; }
.chart text { fill: var(--muted); font: 12px var(--body); }
.chart .axis { stroke: var(--line); stroke-width: 2; }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.chart .real { fill: var(--real); }
.chart .sim { fill: var(--sim); }
.chart .fit { fill: none; stroke: var(--gold); stroke-width: 2; }
.chart .you { stroke: var(--core); stroke-width: 3; stroke-dasharray: 6 4; }
.chart .youlbl { fill: var(--ink); font: 700 12px var(--label); }
.chart .hit { fill: transparent; }
.chart g.bin:hover rect.real, .chart g.bin:hover rect.sim { filter: brightness(1.25); }
.tip { position: absolute; pointer-events: none; background: var(--space); color: var(--ink); padding: 6px 9px; font-size: 13px; box-shadow: 0 0 0 3px var(--line); white-space: nowrap; transform: translate(-50%, -110%); }
.key { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--muted); }
.key i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }

/* leaderboard */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<script src="firebase-config.js"></script>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <div class="brand">
      <small id="tagline">Orbit Station · H2 Physics</small>
      <h1>Paper One Duel</h1>
    </div>
    <div class="who">
      <label for="nick">Callsign</label>
      <input id="nick" maxlength="20" autocomplete="off" spellcheck="false">
      <button id="acct" class="btn ghost small" hidden></button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#duel" data-v="duel">Play</a>
    <a href="#daily" data-v="daily">Daily test</a>
    <a href="#practice" data-v="practice">Practice</a>
    <a href="#progress" data-v="progress">Progress</a>
    <a href="#leaderboard" data-v="leaderboard">Leaderboard</a>
    <label class="subj" for="subject">Subject <select id="subject"></select></label>
  </nav>
  <main id="view"><div class="sheet"><p class="muted">Docking… loading the question banks.</p></div></main>
</div>

<script>
"use strict";
/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const svgEl = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const LETTERS = ["A", "B", "C", "D"];
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, r = Math.random) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const permFor = seed => shuffle([0, 1, 2, 3], rng(hash(seed)));
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]);
// Built from code points so the source never contains raw control or invisible characters.
const BAD_CHARS = new RegExp("[" + [[0,31],[127,159],[0x200b,0x200f],[0x2028,0x202e],[0x2060,0x206f],[0xfeff,0xfeff]].map(([a,b]) => "\\u" + a.toString(16).padStart(4,"0") + "-\\u" + b.toString(16).padStart(4,"0")).join("") + "]", "g");
const cleanNick = s => String(s || "").replace(BAD_CHARS, "").trim().slice(0, 20);
const initials = s => { const w = cleanNick(s).split(/\s+/).filter(Boolean); return ((w[0] || "?")[0] + (w[1] ? w[1][0] : (w[0] || "").slice(1, 2))).toUpperCase(); };
const seatColor = i => `var(--s${i % 8})`;

/* pixel sprites */
const HELMET = ["..XXXXXX..", ".XXXXXXXX.", "XXVVVVVVXX", "XVWWVVVVVX", "XVWVVVVVVX", "XVVVVVVVVX", "XXVVVVVVXX", ".XXXXXXXX.", "..XX..XX..", ".XXX..XXX."];
function helmet(seat) {
  let r = "";
  HELMET.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === ".") return;
    const fill = ch === "X" ? `var(--s${seat % 8})` : ch === "V" ? "#0B0E24" : "#E8ECFF";
    r += `<rect x="${x}" y="${y}" width="1" height="1" style="fill:${fill}"/>`;
  }));
  return svgEl(`<svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`);
}
function coreSprite() {
  let r = "";
  for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) {
    const d = Math.hypot(x - 5.5, y - 5.5);
    if (d > 5.6) continue;
    const fill = d < 2 ? "#FFF3C4" : d < 3.6 ? "#FFD166" : d < 4.8 ? "#FF7A45" : "#C23B4A";
    r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${fill}"/>`;
  }
  r += `<rect x="8" y="2" width="1" height="1" fill="#FFF"/><rect x="9" y="1" width="1" height="1" fill="#FFD166"/>`;
  return svgEl(`<svg class="corepx" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`);
}

/* ---------- question banks ---------- */
const BANKS = [
  { key: "h2", file: "questions.json", name: "H2 Physics", tag: "Orbit Station · H2 Physics 9478 · Paper 1 style" },
  { key: "sci", file: "psle-science.json", name: "PSLE Science", tag: "Orbit Station · PSLE Science · Booklet A style" },
  { key: "math", file: "psle-maths.json", name: "PSLE Maths", tag: "Orbit Station · PSLE Maths · Paper 1 style" },
];
const bankInfo = k => BANKS.find(b => b.key === k) || BANKS[0];

/* ---------- state ---------- */
const S = {
  banks: {}, subject: "h2",
  bank: [], byId: {}, sections: [], constants: "",   // bank/sections/constants follow the selected subject
  view: "duel",
  db: null, uid: null, room: null, roomState: "connecting",
  peers: [], myPeer: null, pres: {},
  nick: "", named: false, storeMode: "local",
  joining: null, match: null, lobbyMsg: "",
  form: { mode: "race", n: 10, pool: "all", lives: 2, fuse: 30 },
  prac: { topic: "all", mode: "smart", qid: null, perm: null, picked: null },
  daily: null, dailyEntries: [], dailyState: "idle", dailyKey: "",
  board: [], boardState: "idle",
};
const RACE_LIM = 60;     // seconds per question in Race
const GRACE = 1000;      // ms to wait after the first correct answer, so a faster-but-laggier rival can still land
const MAX_PLAYERS = 8;
const P = { q: {}, w: 0, l: 0, d: 0 };

const Q = id => S.byId[id];
const masteredIn = qs => qs.reduce((n, q) => n + (P.q[q.id]?.last === 1 ? 1 : 0), 0);
const seenIn = qs => qs.reduce((n, q) => n + (P.q[q.id] ? 1 : 0), 0);
const allQs = () => Object.values(S.banks).flatMap(b => b.questions);
const masteredCount = () => masteredIn(S.bank);
const seenCount = () => seenIn(S.bank);
function setSubject(k) {
  const b = S.banks[k] ? k : "h2";
  S.subject = b; S.bank = S.banks[b].questions; S.sections = S.banks[b].sections; S.constants = S.banks[b].constants;
  $("#tagline").textContent = bankInfo(b).tag;
  $("#subject").value = b;
}

/* ---------- progress storage ---------- */
let saveTimer = null, saveChain = Promise.resolve(), progRef = null, lastPlayerBody = "";
function record(id, ok) {
  const r = Object.assign({ n: 0, c: 0 }, P.q[id]);
  r.n++; if (ok) r.c++; r.last = ok ? 1 : 0; r.t = Date.now();
  P.q[id] = r; scheduleSave();
}
function scheduleSave() {
  lsSet("p1d.progress", P);
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200);
}
function flush() {
  if (S.storeMode !== "db" || !progRef) return;
  const body = JSON.parse(JSON.stringify(P));
  saveChain = saveChain
    .then(() => progRef.set(body))
    .catch(e => { if (e && e.code === "invalid_argument") { S.storeMode = "local"; if (S.view === "progress") render(); } })
    .then(writePlayer);
}
function writePlayer() {
  if (!S.db || !S.uid || S.storeMode !== "db") return;
  if (!seenIn(allQs()) && !(P.w + P.l + P.d)) return;   // stay off the board until you have played
  const body = { nick: S.nick, mastered: masteredIn(allQs()), seen: seenIn(allQs()), w: P.w, l: P.l, d: P.d };
  for (const b of BANKS) if (S.banks[b.key]) body["m_" + b.key] = masteredIn(S.banks[b.key].questions);
  const key = JSON.stringify(body);
  if (key === lastPlayerBody) return;
  lastPlayerBody = key;
  return S.db.doc("players/" + S.uid).set({ ...body, t: Date.now() }).catch(() => {});
}
function mergeProgress(remote) {
  if (!remote || typeof remote !== "object") return;
  const rq = remote.q && typeof remote.q === "object" ? remote.q : {};
  for (const [id, r] of Object.entries(rq)) {
    if (!r || typeof r !== "object") continue;
    const mine = P.q[id];
    if (!mine || (r.t || 0) > (mine.t || 0)) P.q[id] = { n: +r.n || 0, c: +r.c || 0, last: r.last === 1 ? 1 : 0, t: +r.t || 0 };
  }
  for (const k of ["w", "l", "d"]) P[k] = Math.max(P[k] || 0, +remote[k] || 0);
}
async function initStore() {
  const local = lsGet("p1d.progress");
  if (local) mergeProgress(local);
  if (S.db && S.uid) {
    try {
      progRef = S.db.doc("data/users/" + S.uid + "/progress");
      const snap = await withTimeout(progRef.get(), 10000);
      if (snap.exists) mergeProgress(snap.data());
      S.storeMode = "db";
      scheduleSave();
    } catch { S.storeMode = "local"; }
  }
  render();
}

/* ---------- presence ---------- */
function pushPresence(patch) {
  for (const [k, v] of Object.entries(patch)) { if (v === null) delete S.pres[k]; else S.pres[k] = v; }
  if (S.room) S.room.presence(patch).catch(() => {});
}
function onRoomErr() { S.roomState = "off"; S.room = null; render(); }
function initRoom(room) {
  if (!room) { S.roomState = "off"; render(); return; }
  S.room = room; S.roomState = "on";
  room.onPeers(ch => {
    S.peers = ch.peers;
    const me = ch.peers.find(p => p.sameTab);
    if (me) S.myPeer = me.peer;
    onPeersChanged();
  }, onRoomErr);
  pushPresence({ v: 2, nick: S.nick, mast: masteredIn(allQs()), st: "idle" });
  render();
}
const peerOf = id => S.peers.find(p => p.peer === id);
const pp = p => (p && p.presence) || {};

/* ---------- rooms: one host runs the game, everyone follows its state ----------
   Host presence carries g = { id, mode: "race"|"bomb", bk: subject, pl: [peer ids by seat], nm: [names], ph: "lobby"|"cd"|"q"|"r"|"end",
   k: question counter, qs: question ids, n: race length, lim: seconds, sc: race scores, lv: core lives, lives, turn: core holder seat,
   res: last result, win, ab }. Players publish their answer as a = { m: room id, k, c: option index, rt: ms }. */
const validG = g => g && typeof g === "object" && typeof g.id === "string" && Array.isArray(g.pl) && Array.isArray(g.qs) && g.qs.length > 0 && g.qs.every(id => S.byId[id]) && g.pl.length <= MAX_PLAYERS && ["race", "bomb"].includes(g.mode);
const qidOf = g => g.qs[g.k % g.qs.length];
const mySeat = () => S.match ? S.match.g.pl.indexOf(S.myPeer) : -1;
const seatName = (g, i) => cleanNick(g.nm && g.nm[i]) || "Crew";
const modeName = m => m === "bomb" ? "Hot Core" : "Race";
function validAns(a, g) {
  return a && a.m === g.id && a.k === g.k && Number.isInteger(a.c) && a.c >= 0 && a.c < 4 && typeof a.rt === "number" && a.rt >= 0 ? a : null;
}
function seatAnswer(g, s) {
  if (g.pl[s] === S.myPeer && S.match) return validAns(S.match.my, g);
  return validAns(pp(peerOf(g.pl[s])).a, g);
}
function poolFor(key) {
  if (key === "all") return S.bank;
  if (key === "quick") return S.bank.filter(q => q.quick);
  const s = S.sections.find(x => x.name === key);
  return s ? S.bank.filter(q => s.topics.includes(q.topic)) : S.bank;
}
const poolLabel = key => key === "all" ? "Whole syllabus" : key === "quick" ? "Quick-fire" : key;
const roomSubject = g => bankInfo(typeof g.bk === "string" ? g.bk : "h2").name;

function withName(then) {
  if (S.named) return then();
  const input = el("input", { id: "nm-in", maxlength: "20", autocomplete: "off", spellcheck: "false", value: /^Cadet \d+$/.test(S.nick) ? "" : S.nick, placeholder: "e.g. Wei Ling" });
  const err = el("p", { class: "note", hidden: true }, "Enter at least one character.");
  const box = el("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "nm-h" },
    el("form", { class: "sheet", onsubmit: e => {
      e.preventDefault();
      const v = cleanNick(input.value);
      if (!v) { err.hidden = false; input.focus(); return; }
      setNick(v); S.named = true; try { sessionStorage.setItem("p1d.named", "1"); } catch {}
      box.remove(); then();
    } },
      el("p", { class: "eyebrow" }, "Boarding the station"),
      el("h2", { id: "nm-h", style: "margin:0" }, "What's your callsign?"),
      input, err,
      el("div", { class: "row spread" },
        el("button", { type: "button", class: "btn ghost", onclick: () => box.remove() }, "Cancel"),
        el("button", { type: "submit", class: "btn" }, "Take a seat"))));
  box.addEventListener("keydown", e => { if (e.key === "Escape") box.remove(); });
  document.body.append(box);
  input.focus(); input.select();
}
function setNick(v) {
  S.nick = v; $("#nick").value = v; lsSet("p1d.nick", v);
  pushPresence({ nick: v }); writePlayer();
}

function newMatch(role, g, host) {
  return { role, id: g.id, host, g, gKey: JSON.stringify(g), my: null, qStart: {}, recorded: new Set(), ended: false, phaseAt: Date.now(), firstOk: null, gone: {}, readyKey: null, cdAt: null };
}
function openRoom() {
  if (!S.myPeer) return;
  const f = S.form, pool = poolFor(f.pool), ids = shuffle(pool.map(q => q.id));
  const race = f.mode === "race";
  const g = { id: rid(8), mode: f.mode, pl: [S.myPeer], nm: [S.nick], ph: "lobby", k: 0,
    qs: race ? ids.slice(0, Math.min(f.n, ids.length)) : ids, n: race ? Math.min(f.n, ids.length) : 0,
    lim: race ? RACE_LIM : f.fuse, lives: f.lives, pool: f.pool, bk: S.subject, sc: null, lv: null, turn: 0, res: null };
  S.match = newMatch("host", g, S.myPeer);
  S.lobbyMsg = "";
  pushPresence({ st: "host", g, a: null, rd: null, tgt: null, jm: null, mast: masteredIn(allQs()) });
  S.hostTimer = setInterval(hostTick, 200);
  render();
}
function joinRoom(p) {
  const g = pp(p).g; if (!validG(g)) return;
  S.joining = { host: p.peer, id: g.id };
  S.lobbyMsg = "";
  pushPresence({ st: "join", tgt: p.peer, jm: g.id, g: null, a: null, rd: null });
  render();
  setTimeout(() => { if (S.joining && S.joining.id === g.id && !S.match) failJoin("The captain didn't respond. Try another room."); }, 9000);
}
function failJoin(msg) { S.joining = null; S.lobbyMsg = msg; pushPresence({ st: "idle", tgt: null, jm: null }); render(); }
function leaveMatch(msg) {
  clearInterval(S.hostTimer);
  S.match = null; S.joining = null; S.lobbyMsg = msg || "";
  pushPresence({ st: "idle", g: null, a: null, rd: null, tgt: null, jm: null, mast: masteredIn(allQs()) });
  render();
}

function onPeersChanged() {
  const me = S.myPeer;
  if (S.joining && !S.match) {
    const host = peerOf(S.joining.host), g = pp(host).g;
    if (!host) failJoin("That room's captain left.");
    else if (validG(g) && g.id === S.joining.id) {
      if (g.pl.includes(me)) { S.match = newMatch("guest", g, host.peer); S.joining = null; pushPresence({ st: "play" }); onGameState(); return; }
      if (g.ph !== "lobby") failJoin("That game has already launched.");
      else if (g.pl.length >= MAX_PLAYERS) failJoin("That room is full.");
    } else failJoin("That room has closed.");
  }
  const m = S.match;
  if (m && m.role === "guest" && !m.ended) {
    const host = peerOf(m.host);
    if (host) {
      m.hostGone = null;
      const g = pp(host).g;
      if (!validG(g) || g.id !== m.id) { if (m.g.ph === "lobby") return leaveMatch("The captain closed the room."); m.g = { ...m.g, ph: "end", ab: 1 }; onGameState(); return; }
      if (!g.pl.includes(me)) return leaveMatch("You left the room.");
      const key = JSON.stringify(g);
      if (key !== m.gKey) { m.gKey = key; m.g = g; onGameState(); return; }
    }
  }
  if (S.view !== "duel") return;
  if (S.match) renderTable(); else renderLobbyLists();
}

function setG(patch) {
  const m = S.match, prev = m.g;
  m.g = { ...prev, ...patch };
  if (m.g.ph !== prev.ph || m.g.k !== prev.k) { m.phaseAt = Date.now(); m.firstOk = null; }
  m.gKey = JSON.stringify(m.g);
  pushPresence({ g: m.g });
  onGameState();
}
function startGame() {
  const g = S.match.g; if (g.pl.length < 2) return;
  if (g.mode === "race") setG({ ph: "cd", sc: g.pl.map(() => 0) });
  else setG({ ph: "cd", lv: g.pl.map(() => g.lives), turn: Math.floor(Math.random() * g.pl.length) });
}
function hostTick() {
  const m = S.match; if (!m || m.role !== "host") return;
  const g = m.g, now = Date.now();
  if (g.ph === "end") return;
  const present = s => s === 0 || pp(peerOf(g.pl[s])).jm === g.id;
  g.pl.forEach((p, s) => { if (present(s)) delete m.gone[p]; else m.gone[p] = m.gone[p] || now; });
  const goneFor = s => m.gone[g.pl[s]] ? now - m.gone[g.pl[s]] : 0;
  const patch = {};
  const nm = g.pl.map((p, s) => s === 0 ? S.nick : (cleanNick(pp(peerOf(p)).nick) || g.nm[s] || "Crew"));
  if (JSON.stringify(nm) !== JSON.stringify(g.nm)) patch.nm = nm;

  if (g.ph === "lobby") {
    let pl = g.pl.slice(), names = (patch.nm || g.nm).slice();
    const keep = pl.map((_, s) => goneFor(s) < 2500);
    pl = pl.filter((_, s) => keep[s]); names = names.filter((_, s) => keep[s]);
    for (const p of S.peers) {
      if (pl.length >= MAX_PLAYERS) break;
      const pr = pp(p);
      if (!p.sameTab && pr.st === "join" && pr.tgt === S.myPeer && pr.jm === g.id && !pl.includes(p.peer)) { pl.push(p.peer); names.push(cleanNick(pr.nick) || "Crew"); }
    }
    if (pl.length !== g.pl.length || JSON.stringify(names) !== JSON.stringify(g.nm)) setG({ pl, nm: names });
    return;
  }
  if (g.ph === "cd") { if (now - m.phaseAt > 3000) setG({ ...patch, ph: "q" }); else if (patch.nm) setG(patch); return; }

  const active = g.pl.map((_, s) => goneFor(s) < 6000);
  if (g.mode === "race") {
    if (active.filter(Boolean).length < 2) return setG({ ...patch, ph: "end", ab: 1 });
    if (g.ph === "q") {
      const right = Q(qidOf(g)).a;
      const ans = g.pl.map((_, s) => seatAnswer(g, s));
      const ok = ans.map(a => !!a && a.c === right);
      if (ok.some(Boolean)) m.firstOk = m.firstOk || now;
      const allIn = ans.every((a, s) => a || !active[s]);
      const timeUp = now - m.phaseAt > g.lim * 1000 + 1500;
      if (allIn || (m.firstOk && now - m.firstOk > GRACE) || timeUp) {
        let w = -1;
        ok.forEach((o, s) => { if (o && (w < 0 || ans[s].rt < ans[w].rt)) w = s; });
        const sc = g.sc.slice(); if (w >= 0) sc[w]++;
        return setG({ ...patch, ph: "r", sc, res: { w, c: ans.map(a => a ? a.c : null), rt: ans.map(a => a ? a.rt : null) } });
      }
    } else if (g.ph === "r") {
      const key = g.id + ":" + g.k;
      const allReady = g.pl.every((p, s) => !active[s] || (s === 0 ? S.pres.rd === key : pp(peerOf(p)).rd === key));
      if (allReady || now - m.phaseAt > 20000) return setG({ ...patch, ...(g.k + 1 < g.n ? { ph: "q", k: g.k + 1, res: null } : { ph: "end" }) });
    }
    if (patch.nm) setG(patch);
    return;
  }

  // Hot Core
  let lv = g.lv.slice(), lvChanged = false;
  g.pl.forEach((_, s) => { if (!active[s] && lv[s] > 0) { lv[s] = 0; lvChanged = true; } });
  const alive = lv.map((l, s) => l > 0 ? s : -1).filter(s => s >= 0);
  const nextAlive = from => { for (let d = 1; d <= lv.length; d++) { const s = (from + d) % lv.length; if (lv[s] > 0) return s; } return -1; };
  if (alive.length <= 1) return setG({ ...patch, lv, ph: "end", win: alive.length ? alive[0] : -1 });
  if (lvChanged) patch.lv = lv;
  if (g.ph === "q") {
    const s = g.turn;
    if (lv[s] <= 0) return setG({ ...patch, k: g.k + 1, turn: nextAlive(s), res: null });
    const a = seatAnswer(g, s);
    const timeUp = now - m.phaseAt > g.lim * 1000 + 800;
    if (a || timeUp) {
      const ok = !!a && a.c === Q(qidOf(g)).a;
      if (!ok) lv[s]--;
      return setG({ ...patch, lv, ph: "r", res: { seat: s, c: a ? a.c : null, rt: a ? a.rt : null, ok, boom: !ok } });
    }
  } else if (g.ph === "r") {
    if (now - m.phaseAt > (g.res && g.res.ok ? 2200 : 3800)) {
      const still = lv.filter(l => l > 0).length;

        el("span", { class: "tpct" }, `${tm}/${tq.length}`)));
    }
    sheet.append(sec);
  }
  sheet.append(el("p", { class: "note" }, S.storeMode !== "db" ? "Progress is saved in this browser only." : S.google ? "Progress is saved to your Google-linked account, so it follows you across devices." : "Progress is saved online for this browser. Use Sync with Google to keep it on other devices too."));
  wrap.append(sheet);
  return wrap;
}

/* leaderboard */
let boardUnsub = null;
function subscribeBoard() {
  if (!S.db || boardUnsub) return;
  S.boardState = "loading";
  const timer = setTimeout(() => { if (S.boardState === "loading") { S.boardState = "slow"; if (S.view === "leaderboard") render(); } }, 10000);
  boardUnsub = S.db.collection("players").orderBy("mastered", "desc").limit(200).onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    S.board = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.boardState = "ok";
    if (S.view === "leaderboard") render();
  }, () => { clearTimeout(timer); S.boardState = "err"; if (S.view === "leaderboard") render(); });
}
function boardView() {
  const sheet = el("section", { class: "sheet" }, el("p", { class: "eyebrow" }, "Standings"), el("h2", {}, "Leaderboard"));
  if (!S.db) { sheet.append(el("div", { class: "empty" }, "The leaderboard isn't connected. It needs the Firebase setup described in the README.")); return sheet; }
  if (S.boardState === "loading") { sheet.append(el("p", { class: "muted blink" }, "Loading standings…")); return sheet; }
  if (S.boardState === "slow") sheet.append(el("div", { class: "banner" }, "The standings can't be reached right now. They'll appear when the connection returns."));
  if (S.boardState === "err") { sheet.append(el("div", { class: "empty" }, "The standings couldn't be loaded.")); return sheet; }
  const mf = r => { const v = r["m_" + S.subject]; return Number.isFinite(+v) ? +v : (S.subject === "h2" && Number.isFinite(+r.mastered) ? +r.mastered : 0); };
  const rows = S.board.filter(r => Number.isFinite(+r.mastered)).sort((a, b) => (mf(b) - mf(a)) || ((+b.w || 0) - (+a.w || 0)));
  if (!rows.length) { sheet.append(el("div", { class: "empty" }, "Nobody is on the board yet. Answer a question or finish a game to get on it.")); return sheet; }
  const tbody = el("tbody");
  rows.forEach((r, i) => {
    tbody.append(el("tr", { class: r.id === S.uid ? "me" : null },
      el("td", { class: "num" }, i + 1), el("td", {}, cleanNick(r.nick) || "Crew"),
      el("td", { class: "num" }, `${mf(r)}/${S.bank.length}`),
      el("td", { class: "num" }, +r.w || 0), el("td", { class: "num" }, +r.l || 0), el("td", { class: "num" }, +r.d || 0)));
  });
  sheet.append(el("div", { class: "tablewrap" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", { class: "num" }, "#"), el("th", {}, "Crew"), el("th", { class: "num" }, "Mastered · " + bankInfo(S.subject).name), el("th", { class: "num" }, "W"), el("th", { class: "num" }, "L"), el("th", { class: "num" }, "D"))),
    tbody)));
  sheet.append(el("p", { class: "note", style: "margin-top:10px" }, "Switch subject at the top right to see each subject's standings. Mastered means the last answer to that question was right. W–L–D counts finished games: a win is sole first place in Race, or last standing in Hot Core."));
  return sheet;
}

/* ---------- routing ---------- */
const VIEWS = ["duel", "daily", "practice", "progress", "leaderboard"];
function route() {
  const h = location.hash.replace("#", "");
  S.view = VIEWS.includes(h) ? h : "duel";
  if (S.view === "leaderboard") subscribeBoard();
  render();
}
window.addEventListener("hashchange", route);

/* ---------- boot ---------- */
async function boot() {
  S.nick = cleanNick(lsGet("p1d.nick")) || "Cadet " + Math.floor(100 + Math.random() * 900);
  try { S.named = sessionStorage.getItem("p1d.named") === "1"; } catch {}
  const nickIn = $("#nick"); nickIn.value = S.nick;
  nickIn.addEventListener("change", () => {
    const v = cleanNick(nickIn.value); if (!v) { nickIn.value = S.nick; return; }
    setNick(v); S.named = true; try { sessionStorage.setItem("p1d.named", "1"); } catch {}
  });
  try {
    const loaded = await Promise.all(BANKS.map(b => fetch(b.file, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(b.file); return r.json(); })));
    BANKS.forEach((b, i) => {
      const data = loaded[i];
      for (const q of data.questions) { q.bk = b.key; S.byId[q.id] = q; }
      S.banks[b.key] = { questions: data.questions, sections: data.sections, constants: data.constants || "" };
    });
    const sel = $("#subject");
    for (const b of BANKS) sel.append(el("option", { value: b.key }, b.name));
    sel.addEventListener("change", () => {
      setSubject(sel.value); lsSet("p1d.subject", S.subject);
      S.prac.topic = "all"; S.prac.qid = null;
      S.form.pool = S.form.mode === "bomb" ? "quick" : "all";
      if (S.view !== "duel" || !S.match) render();
    });
    setSubject(lsGet("p1d.subject") || "h2");
  } catch {
    $("#view").replaceChildren(el("div", { class: "sheet" }, el("p", {}, "The question banks couldn't be loaded. Reload the page to try again.")));
    return;
  }
  route();
  const fb = await initFirebase();
  if (!fb) { S.roomState = "off"; await initStore(); return; }
  S.uid = fb.user.uid; S.db = fb.db;
  if (!lsGet("p1d.nick") && fb.user.displayName) {
    const first = cleanNick(fb.user.displayName.split(/\s+/)[0]);
    if (first) { S.nick = first; nickIn.value = first; }
  }
  S.dailyKey = "";   // resubscribe now that the database is available
  await initStore();
  initRoom(fb.room);
  if (S.view === "leaderboard") subscribeBoard();
  if (S.view === "daily") { S.daily = null; render(); }
}

/* ---------- Firebase backend ----------
   Presence lives at lobby/<connection id>; Firebase deletes it when the tab disconnects.
   Each presence object is stored as a JSON string, because Firebase drops nulls inside arrays. */
const FB_SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.append(s); });
}
async function initFirebase() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || /PASTE/.test(cfg.apiKey)) { S.setupMissing = true; return null; }
  try {
    if (typeof window.firebase === "undefined") {   // tests inject a fake firebase first
      await loadScript(FB_SDK + "firebase-app-compat.js");
      await Promise.all([loadScript(FB_SDK + "firebase-auth-compat.js"), loadScript(FB_SDK + "firebase-database-compat.js")]);
    }
    firebase.initializeApp(cfg);
    const auth = firebase.auth(), rtdb = firebase.database();
    let user = await new Promise(ok => { const off = auth.onAuthStateChanged(u => { off(); ok(u); }); });
    if (!user) user = (await auth.signInAnonymously()).user;
    setupAccountButton(auth, user);
    return { user, db: makeDb(rtdb), room: makeRoom(rtdb, user.uid) };
  } catch (e) {
    console.error("Firebase failed to start", e);
    return null;
  }
}
function makeDb(rtdb) {
  return {
    doc(path) {
      const ref = rtdb.ref(path);
      return { get: () => ref.get().then(s => ({ exists: s.exists(), data: () => s.val() })), set: body => ref.set(body) };
    },
    collection(path) {
      let q = rtdb.ref(path);
      const api = {
        orderBy(f) { q = q.orderByChild(f); return api; },
        limit(n) { q = q.limitToLast(n); return api; },
        onSnapshot(next, err) {
          const cb = s => { const docs = []; s.forEach(c => { const v = c.val(); docs.push({ id: c.key, data: () => v }); }); next({ docs, metadata: { fromCache: false } }); };
          q.on("value", cb, err);
          return () => q.off("value", cb);
        }
      };
      return api;
    }
  };
}
function makeRoom(rtdb, uid) {
  const lobby = rtdb.ref("lobby"), me = lobby.push();
  let pres = {};
  const write = () => me.set({ by: uid, p: JSON.stringify(pres) });
  rtdb.ref(".info/connected").on("value", s => { if (s.val() === true) me.onDisconnect().remove().then(write).catch(() => {}); });
  return {
    presence(patch) {
      for (const [k, v] of Object.entries(patch)) { if (v === null) delete pres[k]; else pres[k] = v; }
      return write();
    },
    onPeers(fn, onErr) {
      lobby.on("value", s => {
        const peers = [];
        s.forEach(c => {
          const v = c.val() || {}; let p = {};
          try { p = JSON.parse(v.p) || {}; } catch {}
          peers.push({ peer: c.key, by: v.by || null, isMe: v.by === uid, sameTab: c.key === me.key, presence: p });
        });
        if (!peers.some(p => p.sameTab)) peers.push({ peer: me.key, by: uid, isMe: true, sameTab: true, presence: pres });
        fn({ peers });
      }, () => onErr && onErr());
    }
  };
}
function setupAccountButton(auth, user) {
  const b = $("#acct"); b.hidden = false;
  S.google = !user.isAnonymous;
  if (S.google) {
    b.textContent = "Sign out";
    b.title = "Signed in with Google as " + (user.email || user.displayName || "you");
    b.onclick = () => auth.signOut().then(() => location.reload());
  } else {
    b.textContent = "Sync with Google";
    b.title = "Keep your progress across devices";
    b.onclick = async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try { await user.linkWithPopup(provider); location.reload(); }
      catch (e) {
        if (e.code === "auth/credential-already-in-use" && e.credential) { await auth.signInWithCredential(e.credential); location.reload(); }
        else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") { S.lobbyMsg = "Google sign-in failed: " + (e.code || "unknown error"); render(); }
      }
    };
  }
}
boot();
</script>
