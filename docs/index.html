<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paper One Duel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cellipse cx=%2716%27 cy=%2716%27 rx=%2714%27 ry=%279.5%27 fill=%27%232A2F3B%27 stroke=%27%23C8336A%27 stroke-width=%273%27/%3E%3C/svg%3E">
<meta name="description" content="Party-style multiple-choice game for H2 Physics, PSLE Science and PSLE Maths: race or pass the bomb with 2–8 players, plus practice and progress tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an optical answer sheet. Paper-white sheets on a cool desk, drop-out pink printing for structure,
   graphite for marks you make. In a room, players sit around a round table with the question below it. */
:root {
  --desk: #EEF0F4;
  --sheet: #FFFFFF;
  --ink: #1B2030;
  --muted: #5B6377;
  --rule: #DADDE6;
  --drop: #C8336A;          /* OMR drop-out ink: structure only */
  --drop-soft: #FBE6EE;
  --graphite: #2A2F3B;      /* a shaded bubble */
  --on-graphite: #FFFFFF;
  --good: #1D7F52;
  --good-soft: #E1F3EA;
  --bad: #B83A12;
  --bad-soft: #FBE9E1;
  --s0: #3446C4; --s1: #0B7B84; --s2: #B5531A; --s3: #7A3FB8; --s4: #1D7F52; --s5: #B8336A; --s6: #8A6D00; --s7: #44515F;
  --on-seat: #FFFFFF;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --desk: #10131B; --sheet: #191D28; --ink: #E8EAF1; --muted: #9AA1B4; --rule: #2C3243;
    --drop: #F0709E; --drop-soft: #3A1F2C; --graphite: #E8EAF1; --on-graphite: #10131B;
    --good: #4CC48C; --good-soft: #15301F; --bad: #F2865C; --bad-soft: #3A2016;
    --s0: #93A0FF; --s1: #46C9D3; --s2: #F29A5E; --s3: #C39BF5; --s4: #4CC48C; --s5: #F0709E; --s6: #E2C24E; --s7: #A9B6C4;
    --on-seat: #10131B;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0; background: var(--desk); color: var(--ink); font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--s0); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.wrap { max-width: 1040px; margin: 0 auto; }

/* masthead */
.mast { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-block: 22px 14px; border-bottom: 2px solid var(--drop); }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand small { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--drop); }
.brand h1 { margin: 0; font: 800 clamp(26px, 4.4vw, 38px)/1 var(--display); letter-spacing: -.02em; text-wrap: balance; }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.who label { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.who input { width: 11em; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px 4px; padding-block: 12px; }
nav.tabs a { padding: 7px 14px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; }
nav.tabs a[aria-current="page"] { background: var(--graphite); color: var(--on-graphite); }
nav.tabs a:hover:not([aria-current]) { color: var(--ink); background: var(--sheet); }
nav.tabs { align-items: center; }
.subj { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.subj select { font: 600 14px/1.2 var(--body); letter-spacing: 0; text-transform: none; color: var(--ink); }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px; min-width: 0; }
.eyebrow { font: 500 11px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--drop); margin: 0 0 6px; }
h2 { font: 700 22px/1.2 var(--display); margin: 0 0 12px; text-wrap: balance; }
h3 { font: 700 17px/1.25 var(--display); margin: 0 0 8px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.banner { padding: 10px 14px; border-radius: 8px; background: var(--drop-soft); color: var(--ink); font-size: 14px; margin-bottom: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field span { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
select, .field input { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); min-width: 0; max-width: 100%; }
.btn { appearance: none; border: 1px solid var(--graphite); background: var(--graphite); color: var(--on-graphite); padding: 9px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { filter: brightness(1.12); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.small { padding: 5px 12px; font-size: 13px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--sheet); }

/* mode picker */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border: 0; padding: 0; margin: 0; }
@media (max-width: 460px) { .modes { grid-template-columns: 1fr; } }
.mode { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: 10px; cursor: pointer; }
.mode input { position: absolute; opacity: 0; pointer-events: none; }
.mode b { font: 700 17px/1.2 var(--display); }
.mode span { font-size: 13px; color: var(--muted); line-height: 1.4; }
.mode:has(input:checked) { border-color: var(--drop); background: var(--drop-soft); }
.mode:has(input:focus-visible) { outline: 2px solid var(--s0); outline-offset: 2px; }

/* lobby */
.lobby-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lobby-list li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
.lobby-list li:first-child { border-top: 0; }
.lobby-list .who-col { flex: 1; min-width: 0; }
.lobby-list .nm { font-weight: 600; overflow-wrap: anywhere; }
.tag { font: 600 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; background: var(--drop-soft); color: var(--drop); margin-right: 6px; vertical-align: 1px; }
.empty { padding: 18px; border: 1px dashed var(--rule); border-radius: 8px; color: var(--muted); font-size: 14px; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* the round table */
.table { position: relative; width: min(100%, 390px); aspect-ratio: 1; margin: 4px auto 8px; }
.table::before { content: ""; position: absolute; inset: 17%; border-radius: 50%; border: 2px dashed var(--rule); }
.seat { position: absolute; transform: translate(-50%, -50%); width: 96px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; transition: left .4s, top .4s, opacity .3s; }
.av { --c: var(--s0); position: relative; width: 58px; height: 58px; border-radius: 50%; background: var(--c); color: var(--on-seat); display: grid; place-items: center; font: 800 20px/1 var(--display); box-shadow: 0 0 0 3px var(--sheet); transition: transform .25s, box-shadow .25s; }
.seat.me .av { box-shadow: 0 0 0 3px var(--sheet), 0 0 0 5px var(--c); }
.seat.holder .av { transform: scale(1.18); box-shadow: 0 0 0 3px var(--sheet), 0 0 0 6px var(--drop); }
.seat.out { opacity: .35; filter: grayscale(1); }
.seat.gone .av { opacity: .4; }
.sn { font-size: 13px; font-weight: 600; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb { font: 600 12px/1.2 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.sb.hearts { color: var(--bad); letter-spacing: .1em; }
.mark { position: absolute; right: -5px; bottom: -5px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--mono); background: var(--sheet); border: 2px solid var(--rule); color: var(--ink); }
.mark.lock { border-color: var(--c); color: var(--c); }
.mark.ok { background: var(--good); border-color: var(--good); color: var(--sheet); }
.mark.no { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
@media (max-width: 480px) { .seat { width: 74px; } .av { width: 44px; height: 44px; font-size: 16px; } .sn { max-width: 74px; font-size: 12px; } }
.hub { position: absolute; left: 50%; top: 50%; width: 40%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; text-align: center; }
.hub > * { grid-area: 1 / 1; }
.hub .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.hub .ring circle { fill: none; stroke-width: 5; }
.hub .ring .track { stroke: var(--rule); }
.hub .ring .prog { stroke: var(--drop); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.hub .big { font: 800 clamp(30px, 9vw, 46px)/1 var(--display); color: var(--drop); }
.hub .lbl { font: 600 12px/1.3 var(--mono); color: var(--muted); letter-spacing: .06em; }
.pointer { width: 100%; height: 100%; transition: transform .55s cubic-bezier(.3,1.4,.5,1); }
.pointer::after { content: ""; position: absolute; right: -10px; top: 50%; transform: translateY(-50%); border: 11px solid transparent; border-left: 16px solid var(--drop); border-right: 0; }
.bomb { width: 62%; height: 62%; }
.bomb .body { fill: #262B36; stroke: var(--ink); stroke-width: 2; }
.bomb .shine { fill: #FFFFFF; opacity: .3; }
.bomb .cap { fill: var(--muted); }
.bomb .fuse { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; }
.bomb .spark { fill: var(--drop); transform-origin: 76px 14px; animation: spark .35s ease-in-out infinite alternate; }
@keyframes spark { from { transform: scale(.7); opacity: .7; } to { transform: scale(1.25); opacity: 1; } }
.hub.urgent .bomb { animation: shake .18s linear infinite; }
@keyframes shake { 25% { transform: translate(-2px, 1px) rotate(-3deg); } 75% { transform: translate(2px, -1px) rotate(3deg); } }
.hub.boom .bomb .body { fill: var(--bad); }
.hub .count { position: absolute; bottom: 8%; font: 700 13px/1 var(--mono); color: var(--drop); font-variant-numeric: tabular-nums; }

/* question card */
.panel { display: flex; flex-direction: column; gap: 14px; }
.status { font: 700 19px/1.3 var(--display); }
.status.win { color: var(--good); } .status.lose { color: var(--bad); }
.qcard { display: flex; flex-direction: column; gap: 14px; }
.qhead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
.qid { font: 600 13px/1 var(--mono); color: var(--drop); letter-spacing: .06em; }
.qtopic { font-size: 13px; color: var(--muted); }
.stem { font-size: 17px; line-height: 1.6; margin: 0; max-width: 68ch; }
.opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.opt { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; padding: 10px 14px 10px 10px; border: 1px solid var(--rule); border-radius: 8px; background: transparent; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--drop); background: var(--drop-soft); }
.opt:disabled { cursor: default; }
.bubble { width: 38px; height: 26px; border-radius: 50%; border: 1.5px solid var(--drop); color: var(--drop); display: grid; place-items: center; font: 600 13px/1 var(--mono); transition: background .15s, color .15s; }
.opt.mine .bubble { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .bubble { border-color: var(--good); color: var(--good); }
.opt.correct.mine .bubble { background: var(--good); color: var(--on-graphite); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .bubble { background: var(--bad); border-color: var(--bad); color: var(--on-graphite); }
.otext { overflow-wrap: anywhere; }
.marks { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.chip { --c: var(--s0); font: 600 11px/1 var(--mono); padding: 4px 7px; border-radius: 999px; letter-spacing: .04em; white-space: nowrap; background: var(--c); color: var(--on-seat); }
.explain { border-left: 3px solid var(--good); padding: 8px 14px; background: var(--good-soft); border-radius: 0 8px 8px 0; }
.explain.badx { border-left-color: var(--bad); background: var(--bad-soft); }
.explain p:last-child { margin: 0; }
details.data { font-size: 12px; color: var(--muted); }
details.data summary { cursor: pointer; font-family: var(--mono); letter-spacing: .06em; }
.timer { height: 6px; background: var(--rule); border-radius: 999px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--drop); width: 100%; transition: width .25s linear; }

/* figures (inline SVG from questions.json) */
.fig { color: var(--ink); margin: 0; padding: 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); align-self: flex-start; width: 100%; max-width: 440px; }
.fig svg { display: block; width: 100%; height: auto; }
.fig line, .fig path, .fig polyline, .fig .hollow { stroke: currentColor; stroke-width: 1.5; fill: none; }
.fig .solid, .fig .hd { fill: currentColor; stroke: none; }
.fig .ac { stroke: var(--drop); }
.fig .hd.ac, .fig .acf { fill: var(--drop); stroke: none; }
.fig .thick { stroke-width: 3; }
.fig .guide { stroke: var(--muted); stroke-dasharray: 4 4; }
.fig .guide.solidline { stroke-dasharray: none; }
.fig .hd.guide, .fig .hd.dim { fill: var(--muted); }
.fig .dash { stroke-dasharray: 5 4; }
.fig .dim { stroke: var(--muted); stroke-width: 1; }
.fig text { fill: currentColor; stroke: none; font: 12px var(--mono); }
.fig text.muted { fill: var(--muted); }
.fig text.acfill { fill: var(--drop); font-weight: 600; font-size: 15px; }

/* standings */
.standings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.standings li { display: grid; grid-template-columns: 2em 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; }
.standings li.first { border-color: var(--good); background: var(--good-soft); }
.standings .pos { font: 700 15px/1 var(--mono); color: var(--muted); }
.standings .mini { width: 36px; height: 36px; font-size: 14px; box-shadow: none; }
.standings .pn { font-weight: 600; overflow-wrap: anywhere; }
.standings .pv { font: 600 14px/1 var(--mono); font-variant-numeric: tabular-nums; }

/* name prompt */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--desk) 70%, transparent); backdrop-filter: blur(3px); }
.modal form { width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal input { font-size: 20px; padding: 10px 12px; border: 1.5px solid var(--drop); border-radius: 8px; background: var(--sheet); }

/* progress */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.stat { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; }
.stat b { display: block; font: 800 30px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font: 500 11px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sec { margin-bottom: 18px; }
.sec h3 { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--drop); padding-bottom: 6px; }
.sec h3 small { font: 500 12px/1.4 var(--mono); color: var(--muted); }
.trow { display: grid; grid-template-columns: minmax(0, 14em) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
@media (max-width: 560px) { .trow { grid-template-columns: minmax(0,1fr) auto; } .trow .ovals { grid-column: 1 / -1; } }
.trow .tn { font-size: 14px; overflow-wrap: anywhere; }
.ovals { display: flex; flex-wrap: wrap; gap: 6px; }
.oval { width: 34px; height: 22px; border-radius: 50%; border: 1.5px solid var(--drop); background: transparent; color: var(--drop); font: 600 10px/1 var(--mono); cursor: pointer; padding: 0; }
.oval.ok { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.oval.no { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); text-decoration: line-through; }
.oval:hover { transform: translateY(-1px); }
.tpct { font: 600 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; margin-bottom: 14px; }
.legend .oval { cursor: default; width: 26px; height: 17px; vertical-align: middle; margin-right: 4px; }

/* leaderboard */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
td.num, th.num { text-align: right; }
tr.me td { background: var(--drop-soft); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<script src="firebase-config.js"></script>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <div class="brand">
      <small id="tagline">H2 Physics 9478 · Paper 1 style</small>
      <h1>Paper One Duel</h1>
    </div>
    <div class="who">
      <label for="nick">Name</label>
      <input id="nick" maxlength="20" autocomplete="off" spellcheck="false">
      <button id="acct" class="btn ghost small" hidden></button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#duel" data-v="duel">Play</a>
    <a href="#practice" data-v="practice">Practice</a>
    <a href="#progress" data-v="progress">Progress</a>
    <a href="#leaderboard" data-v="leaderboard">Leaderboard</a>
    <label class="subj" for="subject">Subject <select id="subject"></select></label>
  </nav>
  <main id="view"><div class="sheet"><p class="muted">Loading the question bank…</p></div></main>
</div>

<script>
"use strict";
/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const svgEl = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const LETTERS = ["A", "B", "C", "D"];
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, r = Math.random) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]);
// Built from code points so the source never contains raw control or invisible characters.
const BAD_CHARS = new RegExp("[" + [[0,31],[127,159],[0x200b,0x200f],[0x2028,0x202e],[0x2060,0x206f],[0xfeff,0xfeff]].map(([a,b]) => "\\u" + a.toString(16).padStart(4,"0") + "-\\u" + b.toString(16).padStart(4,"0")).join("") + "]", "g");
const cleanNick = s => String(s || "").replace(BAD_CHARS, "").trim().slice(0, 20);
const initials = s => { const w = cleanNick(s).split(/\s+/).filter(Boolean); return ((w[0] || "?")[0] + (w[1] ? w[1][0] : (w[0] || "").slice(1, 2))).toUpperCase(); };
const seatColor = i => `var(--s${i % 8})`;

/* ---------- question banks ---------- */
const BANKS = [
  { key: "h2", file: "questions.json", name: "H2 Physics", tag: "H2 Physics 9478 · Paper 1 style" },
  { key: "sci", file: "psle-science.json", name: "PSLE Science", tag: "PSLE Science · Booklet A style" },
  { key: "math", file: "psle-maths.json", name: "PSLE Maths", tag: "PSLE Maths · Paper 1 style" },
];
const bankInfo = k => BANKS.find(b => b.key === k) || BANKS[0];

/* ---------- state ---------- */
const S = {
  banks: {}, subject: "h2",
  bank: [], byId: {}, sections: [], constants: "",   // bank/sections/constants follow the selected subject
  view: "duel",
  db: null, uid: null, room: null, roomState: "connecting",
  peers: [], myPeer: null, pres: {},
  nick: "", named: false, storeMode: "local",
  joining: null, match: null, lobbyMsg: "",
  form: { mode: "race", n: 10, pool: "all", lives: 2, fuse: 30 },
  prac: { topic: "all", mode: "smart", qid: null, perm: null, picked: null },
  board: [], boardState: "idle",
};
const RACE_LIM = 60;     // seconds per question in Race
const GRACE = 1000;      // ms to wait after the first correct answer, so a faster-but-laggier rival can still land
const MAX_PLAYERS = 8;
const P = { q: {}, w: 0, l: 0, d: 0 };

const Q = id => S.byId[id];
const masteredIn = qs => qs.reduce((n, q) => n + (P.q[q.id]?.last === 1 ? 1 : 0), 0);
const seenIn = qs => qs.reduce((n, q) => n + (P.q[q.id] ? 1 : 0), 0);
const allQs = () => Object.values(S.banks).flatMap(b => b.questions);
const masteredCount = () => masteredIn(S.bank);
const seenCount = () => seenIn(S.bank);
function setSubject(k) {
  const b = S.banks[k] ? k : "h2";
  S.subject = b; S.bank = S.banks[b].questions; S.sections = S.banks[b].sections; S.constants = S.banks[b].constants;
  $("#tagline").textContent = bankInfo(b).tag;
  $("#subject").value = b;
}

/* ---------- progress storage ---------- */
let saveTimer = null, saveChain = Promise.resolve(), progRef = null, lastPlayerBody = "";
function record(id, ok) {
  const r = Object.assign({ n: 0, c: 0 }, P.q[id]);
  r.n++; if (ok) r.c++; r.last = ok ? 1 : 0; r.t = Date.now();
  P.q[id] = r; scheduleSave();
}
function scheduleSave() {
  lsSet("p1d.progress", P);
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200);
}
function flush() {
  if (S.storeMode !== "db" || !progRef) return;
  const body = JSON.parse(JSON.stringify(P));
  saveChain = saveChain
    .then(() => progRef.set(body))
    .catch(e => { if (e && e.code === "invalid_argument") { S.storeMode = "local"; if (S.view === "progress") render(); } })
    .then(writePlayer);
}
function writePlayer() {
  if (!S.db || !S.uid || S.storeMode !== "db") return;
  if (!seenIn(allQs()) && !(P.w + P.l + P.d)) return;   // stay off the board until you have played
  const body = { nick: S.nick, mastered: masteredIn(allQs()), seen: seenIn(allQs()), w: P.w, l: P.l, d: P.d };
  for (const b of BANKS) if (S.banks[b.key]) body["m_" + b.key] = masteredIn(S.banks[b.key].questions);
  const key = JSON.stringify(body);
  if (key === lastPlayerBody) return;
  lastPlayerBody = key;
  return S.db.doc("players/" + S.uid).set({ ...body, t: Date.now() }).catch(() => {});
}
function mergeProgress(remote) {
  if (!remote || typeof remote !== "object") return;
  const rq = remote.q && typeof remote.q === "object" ? remote.q : {};
  for (const [id, r] of Object.entries(rq)) {
    if (!r || typeof r !== "object") continue;
    const mine = P.q[id];
    if (!mine || (r.t || 0) > (mine.t || 0)) P.q[id] = { n: +r.n || 0, c: +r.c || 0, last: r.last === 1 ? 1 : 0, t: +r.t || 0 };
  }
  for (const k of ["w", "l", "d"]) P[k] = Math.max(P[k] || 0, +remote[k] || 0);
}
async function initStore() {
  const local = lsGet("p1d.progress");
  if (local) mergeProgress(local);
  if (S.db && S.uid) {
    try {
      progRef = S.db.doc("data/users/" + S.uid + "/progress");
      const snap = await withTimeout(progRef.get(), 10000);
      if (snap.exists) mergeProgress(snap.data());
      S.storeMode = "db";
      scheduleSave();
    } catch { S.storeMode = "local"; }
  }
  render();
}

/* ---------- presence ---------- */
function pushPresence(patch) {
  for (const [k, v] of Object.entries(patch)) { if (v === null) delete S.pres[k]; else S.pres[k] = v; }
  if (S.room) S.room.presence(patch).catch(() => {});
}
function onRoomErr() { S.roomState = "off"; S.room = null; render(); }
function initRoom(room) {
  if (!room) { S.roomState = "off"; render(); return; }
  S.room = room; S.roomState = "on";
  room.onPeers(ch => {
    S.peers = ch.peers;
    const me = ch.peers.find(p => p.sameTab);
    if (me) S.myPeer = me.peer;
    onPeersChanged();
  }, onRoomErr);
  pushPresence({ v: 2, nick: S.nick, mast: masteredCount(), st: "idle" });
  render();
}
const peerOf = id => S.peers.find(p => p.peer === id);
const pp = p => (p && p.presence) || {};

/* ---------- rooms: one host runs the game, everyone follows its state ----------
   Host presence carries g = { id, mode: "race"|"bomb", pl: [peer ids by seat], nm: [names], ph: "lobby"|"cd"|"q"|"r"|"end",
   k: question counter, qs: question ids, n: race length, lim: seconds, sc: race scores, lv: bomb lives, lives, turn: bomb holder seat,
   res: last result, win, ab }. Players publish their answer as a = { m: room id, k, c: option index, rt: ms }. */
const validG = g => g && typeof g === "object" && typeof g.id === "string" && Array.isArray(g.pl) && Array.isArray(g.qs) && g.qs.length > 0 && g.qs.every(id => S.byId[id]) && g.pl.length <= MAX_PLAYERS && ["race", "bomb"].includes(g.mode);
const qidOf = g => g.qs[g.k % g.qs.length];
const mySeat = () => S.match ? S.match.g.pl.indexOf(S.myPeer) : -1;
const seatName = (g, i) => cleanNick(g.nm && g.nm[i]) || "Player";
function validAns(a, g) {
  return a && a.m === g.id && a.k === g.k && Number.isInteger(a.c) && a.c >= 0 && a.c < 4 && typeof a.rt === "number" && a.rt >= 0 ? a : null;
}
function seatAnswer(g, s) {
  if (g.pl[s] === S.myPeer && S.match) return validAns(S.match.my, g);
  return validAns(pp(peerOf(g.pl[s])).a, g);
}
function poolFor(key) {
  if (key === "all") return S.bank;
  if (key === "quick") return S.bank.filter(q => q.quick);
  const s = S.sections.find(x => x.name === key);
  return s ? S.bank.filter(q => s.topics.includes(q.topic)) : S.bank;
}
const poolLabel = key => key === "all" ? "Whole syllabus" : key === "quick" ? "Quick-fire" : key;
const roomSubject = g => bankInfo(typeof g.bk === "string" ? g.bk : "h2").name;

function withName(then) {
  if (S.named) return then();
  const input = el("input", { id: "nm-in", maxlength: "20", autocomplete: "off", spellcheck: "false", value: /^Player \d+$/.test(S.nick) ? "" : S.nick, placeholder: "e.g. Wei Ling" });
  const err = el("p", { class: "note", hidden: true }, "Enter at least one character.");
  const box = el("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "nm-h" },
    el("form", { class: "sheet", onsubmit: e => {
      e.preventDefault();
      const v = cleanNick(input.value);
      if (!v) { err.hidden = false; input.focus(); return; }
      setNick(v); S.named = true; try { sessionStorage.setItem("p1d.named", "1"); } catch {}
      box.remove(); then();
    } },
      el("p", { class: "eyebrow" }, "Before you sit down"),
      el("h2", { id: "nm-h", style: "margin:0" }, "What should the table call you?"),
      input, err,
      el("div", { class: "row spread" },
        el("button", { type: "button", class: "btn ghost", onclick: () => box.remove() }, "Cancel"),
        el("button", { type: "submit", class: "btn" }, "Take a seat"))));
  box.addEventListener("keydown", e => { if (e.key === "Escape") box.remove(); });
  document.body.append(box);
  input.focus(); input.select();
}
function setNick(v) {
  S.nick = v; $("#nick").value = v; lsSet("p1d.nick", v);
  pushPresence({ nick: v }); writePlayer();
}

function newMatch(role, g, host) {
  return { role, id: g.id, host, g, gKey: JSON.stringify(g), my: null, qStart: {}, recorded: new Set(), ended: false, phaseAt: Date.now(), firstOk: null, gone: {}, readyKey: null, cdAt: null };
}
function openRoom() {
  if (!S.myPeer) return;
  const f = S.form, pool = poolFor(f.pool), ids = shuffle(pool.map(q => q.id));
  const race = f.mode === "race";
  const g = { id: rid(8), mode: f.mode, pl: [S.myPeer], nm: [S.nick], ph: "lobby", k: 0,
    qs: race ? ids.slice(0, Math.min(f.n, ids.length)) : ids, n: race ? Math.min(f.n, ids.length) : 0,
    lim: race ? RACE_LIM : f.fuse, lives: f.lives, pool: f.pool, bk: S.subject, sc: null, lv: null, turn: 0, res: null };
  S.match = newMatch("host", g, S.myPeer);
  S.lobbyMsg = "";
  pushPresence({ st: "host", g, a: null, rd: null, tgt: null, jm: null, mast: masteredCount() });
  S.hostTimer = setInterval(hostTick, 200);
  render();
}
function joinRoom(p) {
  const g = pp(p).g; if (!validG(g)) return;
  S.joining = { host: p.peer, id: g.id };
  S.lobbyMsg = "";
  pushPresence({ st: "join", tgt: p.peer, jm: g.id, g: null, a: null, rd: null });
  render();
  setTimeout(() => { if (S.joining && S.joining.id === g.id && !S.match) failJoin("The host didn't respond. Try another room."); }, 9000);
}
function failJoin(msg) { S.joining = null; S.lobbyMsg = msg; pushPresence({ st: "idle", tgt: null, jm: null }); render(); }
function leaveMatch(msg) {
  clearInterval(S.hostTimer);
  S.match = null; S.joining = null; S.lobbyMsg = msg || "";
  pushPresence({ st: "idle", g: null, a: null, rd: null, tgt: null, jm: null, mast: masteredCount() });
  render();
}

function onPeersChanged() {
  const me = S.myPeer;
  if (S.joining && !S.match) {
    const host = peerOf(S.joining.host), g = pp(host).g;
    if (!host) failJoin("That room's host left.");
    else if (validG(g) && g.id === S.joining.id) {
      if (g.pl.includes(me)) { S.match = newMatch("guest", g, host.peer); S.joining = null; pushPresence({ st: "play" }); onGameState(); return; }
      if (g.ph !== "lobby") failJoin("That game has already started.");
      else if (g.pl.length >= MAX_PLAYERS) failJoin("That room is full.");
    } else failJoin("That room has closed.");
  }
  const m = S.match;
  if (m && m.role === "guest" && !m.ended) {
    const host = peerOf(m.host);
    if (host) {
      m.hostGone = null;
      const g = pp(host).g;
      if (!validG(g) || g.id !== m.id) { if (m.g.ph === "lobby") return leaveMatch("The host closed the room."); m.g = { ...m.g, ph: "end", ab: 1 }; onGameState(); return; }
      if (!g.pl.includes(me)) return leaveMatch("You left the room.");
      const key = JSON.stringify(g);
      if (key !== m.gKey) { m.gKey = key; m.g = g; onGameState(); return; }
    }
  }
  if (S.view !== "duel") return;
  if (S.match) renderTable(); else renderLobbyLists();
}

function setG(patch) {
  const m = S.match, prev = m.g;
  m.g = { ...prev, ...patch };
  if (m.g.ph !== prev.ph || m.g.k !== prev.k) { m.phaseAt = Date.now(); m.firstOk = null; }
  m.gKey = JSON.stringify(m.g);
  pushPresence({ g: m.g });
  onGameState();
}
function startGame() {
  const g = S.match.g; if (g.pl.length < 2) return;
  if (g.mode === "race") setG({ ph: "cd", sc: g.pl.map(() => 0) });
  else setG({ ph: "cd", lv: g.pl.map(() => g.lives), turn: Math.floor(Math.random() * g.pl.length) });
}
function hostTick() {
  const m = S.match; if (!m || m.role !== "host") return;
  const g = m.g, now = Date.now();
  if (g.ph === "end") return;
  const present = s => s === 0 || pp(peerOf(g.pl[s])).jm === g.id;
  g.pl.forEach((p, s) => { if (present(s)) delete m.gone[p]; else m.gone[p] = m.gone[p] || now; });
  const goneFor = s => m.gone[g.pl[s]] ? now - m.gone[g.pl[s]] : 0;
  const patch = {};
  const nm = g.pl.map((p, s) => s === 0 ? S.nick : (cleanNick(pp(peerOf(p)).nick) || g.nm[s] || "Player"));
  if (JSON.stringify(nm) !== JSON.stringify(g.nm)) patch.nm = nm;

  if (g.ph === "lobby") {
    let pl = g.pl.slice(), names = (patch.nm || g.nm).slice();
    const keep = pl.map((_, s) => goneFor(s) < 2500);
    pl = pl.filter((_, s) => keep[s]); names = names.filter((_, s) => keep[s]);
    for (const p of S.peers) {
      if (pl.length >= MAX_PLAYERS) break;
      const pr = pp(p);
      if (!p.sameTab && pr.st === "join" && pr.tgt === S.myPeer && pr.jm === g.id && !pl.includes(p.peer)) { pl.push(p.peer); names.push(cleanNick(pr.nick) || "Player"); }
    }
    if (pl.length !== g.pl.length || JSON.stringify(names) !== JSON.stringify(g.nm)) setG({ pl, nm: names });
    return;
  }
  if (g.ph === "cd") { if (now - m.phaseAt > 3000) setG({ ...patch, ph: "q" }); else if (patch.nm) setG(patch); return; }

  const active = g.pl.map((_, s) => goneFor(s) < 6000);
  if (g.mode === "race") {
    if (active.filter(Boolean).length < 2) return setG({ ...patch, ph: "end", ab: 1 });
    if (g.ph === "q") {
      const right = Q(qidOf(g)).a;
      const ans = g.pl.map((_, s) => seatAnswer(g, s));
      const ok = ans.map(a => !!a && a.c === right);
      if (ok.some(Boolean)) m.firstOk = m.firstOk || now;
      const allIn = ans.every((a, s) => a || !active[s]);
      const timeUp = now - m.phaseAt > g.lim * 1000 + 1500;
      if (allIn || (m.firstOk && now - m.firstOk > GRACE) || timeUp) {
        let w = -1;
        ok.forEach((o, s) => { if (o && (w < 0 || ans[s].rt < ans[w].rt)) w = s; });
        const sc = g.sc.slice(); if (w >= 0) sc[w]++;
        return setG({ ...patch, ph: "r", sc, res: { w, c: ans.map(a => a ? a.c : null), rt: ans.map(a => a ? a.rt : null) } });
      }
    } else if (g.ph === "r") {
      const key = g.id + ":" + g.k;
      const allReady = g.pl.every((p, s) => !active[s] || (s === 0 ? S.pres.rd === key : pp(peerOf(p)).rd === key));
      if (allReady || now - m.phaseAt > 20000) return setG({ ...patch, ...(g.k + 1 < g.n ? { ph: "q", k: g.k + 1, res: null } : { ph: "end" }) });
    }
    if (patch.nm) setG(patch);
    return;
  }

  // Bomb
  let lv = g.lv.slice(), lvChanged = false;
  g.pl.forEach((_, s) => { if (!active[s] && lv[s] > 0) { lv[s] = 0; lvChanged = true; } });
  const alive = lv.map((l, s) => l > 0 ? s : -1).filter(s => s >= 0);
  const nextAlive = from => { for (let d = 1; d <= lv.length; d++) { const s = (from + d) % lv.length; if (lv[s] > 0) return s; } return -1; };
  if (alive.length <= 1) return setG({ ...patch, lv, ph: "end", win: alive.length ? alive[0] : -1 });
  if (lvChanged) patch.lv = lv;
  if (g.ph === "q") {
    const s = g.turn;
    if (lv[s] <= 0) return setG({ ...patch, k: g.k + 1, turn: nextAlive(s), res: null });
    const a = seatAnswer(g, s);
    const timeUp = now - m.phaseAt > g.lim * 1000 + 800;
    if (a || timeUp) {
      const ok = !!a && a.c === Q(qidOf(g)).a;
      if (!ok) lv[s]--;
      return setG({ ...patch, lv, ph: "r", res: { seat: s, c: a ? a.c : null, rt: a ? a.rt : null, ok, boom: !ok } });
    }
  } else if (g.ph === "r") {
    if (now - m.phaseAt > (g.res && g.res.ok ? 2200 : 3800)) {
      const still = lv.filter(l => l > 0).length;
      if (still <= 1) return setG({ ...patch, lv, ph: "end", win: lv.findIndex(l => l > 0) });
      return setG({ ...patch, lv, ph: "q", k: g.k + 1, turn: nextAlive(g.turn), res: null });
    }
  }
  if (patch.nm || patch.lv) setG(patch);
}
// Guests: notice a vanished host.
setInterval(() => {
  const m = S.match; if (!m || m.role !== "guest" || m.ended) return;
  if (!peerOf(m.host)) {
    m.hostGone = m.hostGone || Date.now();
    if (Date.now() - m.hostGone > 6000) { if (m.g.ph === "lobby") leaveMatch("The host left, so the room closed."); else { m.g = { ...m.g, ph: "end", ab: 1 }; onGameState(); } }
  }
}, 1000);

function onGameState() {
  const m = S.match, g = m.g, key = g.id + ":" + g.k, me = mySeat();
  if (g.ph === "cd" && !m.cdAt) m.cdAt = performance.now();
  if (g.ph === "q" && !m.qStart[key]) m.qStart[key] = performance.now();
  if (g.ph === "r" && !m.recorded.has(key)) {
    m.recorded.add(key);
    const qid = qidOf(g);
    if (g.mode === "race") { const mine = validAns(m.my, g); if (mine) record(qid, mine.c === Q(qid).a); }
    else if (g.res && g.res.seat === me && g.res.c != null) record(qid, !!g.res.ok);
  }
  if (g.ph === "end" && !m.ended) {
    m.ended = true;
    clearInterval(S.hostTimer);
    if (!g.ab && me >= 0) {
      if (g.mode === "race") {
        const best = Math.max(...g.sc), tops = g.sc.filter(x => x === best).length;
        if (g.sc[me] === best) { if (tops === 1) P.w++; else P.d++; } else P.l++;
      } else if (g.win === me) P.w++; else P.l++;
      scheduleSave();
    }
    pushPresence({ mast: masteredCount() });
  }
  if (S.view === "duel") renderMatch();
}
function answer(orig) {
  const m = S.match, g = m.g, key = g.id + ":" + g.k;
  if (g.ph !== "q" || validAns(m.my, g)) return;
  if (g.mode === "bomb" && g.turn !== mySeat()) return;
  const rt = Math.round(performance.now() - (m.qStart[key] || performance.now()));
  if (rt > g.lim * 1000) return;
  m.my = { m: g.id, k: g.k, c: orig, rt };
  pushPresence({ a: m.my });
  renderMatch();
}
function ready() {
  const m = S.match, key = m.g.id + ":" + m.g.k;
  m.readyKey = key; pushPresence({ rd: key }); renderMatch();
}

/* ---------- rendering ---------- */
function setTabs() {
  for (const a of document.querySelectorAll("#tabs a")) {
    if (a.dataset.v === S.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
}
function render() {
  setTabs();
  const v = $("#view"); v.replaceChildren();
  if (!S.bank.length) { v.append(el("div", { class: "sheet" }, el("p", { class: "muted" }, "Loading the question bank…"))); return; }
  if (S.view === "duel") v.append(S.match ? matchView() : lobbyView());
  else if (S.view === "practice") v.append(practiceView());
  else if (S.view === "progress") v.append(progressView());
  else if (S.view === "leaderboard") v.append(boardView());
}

function poolSelect(id, value, onchange) {
  return el("select", { id, onchange: e => onchange(e.target.value) },
    el("option", { value: "quick", selected: value === "quick" }, `Quick-fire, mental maths (${poolFor("quick").length})`),
    el("option", { value: "all", selected: value === "all" }, `Whole syllabus (${S.bank.length})`),
    S.sections.map(s => el("option", { value: s.name, selected: value === s.name }, `${s.name} (${poolFor(s.name).length})`)));
}
function lobbyView() {
  const wrap = el("div", { class: "stack" });
  if (S.roomState === "off") wrap.append(el("div", { class: "banner" }, S.setupMissing ? "Live games aren't set up yet: add your Firebase settings to firebase-config.js (see README). Practice and progress tracking still work." : "Live games can't connect right now. Practice and progress tracking still work."));
  if (S.lobbyMsg) wrap.append(el("div", { class: "banner" }, S.lobbyMsg));

  let n = 0, c = 0; for (const q of S.bank) { const r = P.q[q.id]; if (r) { n += r.n; c += r.c; } }
  wrap.append(el("div", { class: "stats" },
    el("div", { class: "stat" }, el("b", {}, `${mast}/${S.bank.length}`), el("span", {}, "Mastered")),
    el("div", { class: "stat" }, el("b", {}, `${seen}`), el("span", {}, "Attempted")),
    el("div", { class: "stat" }, el("b", {}, n ? Math.round(100 * c / n) + "%" : "–"), el("span", {}, "Accuracy")),
    el("div", { class: "stat" }, el("b", {}, `${P.w}–${P.l}–${P.d}`), el("span", {}, "Games W–L–D, all subjects"))));
  const sheet = el("section", { class: "sheet" });
  sheet.append(
    el("p", { class: "eyebrow" }, "Answer sheet"),
    el("h2", {}, `${bankInfo(S.subject).name}, by topic`),
    el("div", { class: "legend" },
      el("span", {}, el("span", { class: "oval" }), "Not yet answered"),
      el("span", {}, el("span", { class: "oval ok" }), "Right last time"),
      el("span", {}, el("span", { class: "oval no" }), "Wrong last time"),
      el("span", {}, "Click a bubble to practise that question.")));
  for (const s of S.sections) {
    const qs = S.bank.filter(q => s.topics.includes(q.topic));
    const sm = qs.filter(q => P.q[q.id]?.last === 1).length;
    const sec = el("div", { class: "sec" }, el("h3", {}, s.name, el("small", {}, `${sm}/${qs.length}`)));
    for (const t of s.topics) {
      const tq = S.bank.filter(q => q.topic === t);
      const tm = tq.filter(q => P.q[q.id]?.last === 1).length;
      sec.append(el("div", { class: "trow" },
        el("span", { class: "tn" }, t),
        el("div", { class: "ovals" }, tq.map((q, i) => {
          const r = P.q[q.id];
          return el("button", { class: "oval" + (r ? (r.last === 1 ? " ok" : " no") : ""), title: `${q.id}${q.fig ? " (picture)" : ""}${r ? ` · ${r.c}/${r.n} correct` : " · not yet answered"}`, "aria-label": `${q.id}, practise`,
            onclick: () => { S.prac.topic = t; nextPractice(q.id); location.hash = "practice"; } }, i + 1);
        })),
        el("span", { class: "tpct" }, `${tm}/${tq.length}`)));
    }
    sheet.append(sec);
  }
  sheet.append(el("p", { class: "note" }, S.storeMode !== "db" ? "Progress is saved in this browser only." : S.google ? "Progress is saved to your Google-linked account, so it follows you across devices." : "Progress is saved online for this browser. Use Sync with Google to keep it on other devices too."));
  wrap.append(sheet);
  return wrap;
}

/* leaderboard */
let boardUnsub = null;
function subscribeBoard() {
  if (!S.db || boardUnsub) return;
  S.boardState = "loading";
  const timer = setTimeout(() => { if (S.boardState === "loading") { S.boardState = "slow"; if (S.view === "leaderboard") render(); } }, 10000);
  boardUnsub = S.db.collection("players").orderBy("mastered", "desc").limit(200).onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    S.board = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.boardState = "ok";
    if (S.view === "leaderboard") render();
  }, () => { clearTimeout(timer); S.boardState = "err"; if (S.view === "leaderboard") render(); });
}
function boardView() {
  const sheet = el("section", { class: "sheet" }, el("p", { class: "eyebrow" }, "Standings"), el("h2", {}, "Leaderboard"));
  if (!S.db) { sheet.append(el("div", { class: "empty" }, "The leaderboard isn't connected. It needs the Firebase setup described in the README.")); return sheet; }
  if (S.boardState === "loading") { sheet.append(el("p", { class: "muted" }, "Loading standings…")); return sheet; }
  if (S.boardState === "slow") sheet.append(el("div", { class: "banner" }, "The standings can't be reached right now. They'll appear when the connection returns."));
  if (S.boardState === "err") { sheet.append(el("div", { class: "empty" }, "The standings couldn't be loaded.")); return sheet; }
  const mf = r => { const v = r["m_" + S.subject]; return Number.isFinite(+v) ? +v : (S.subject === "h2" && Number.isFinite(+r.mastered) ? +r.mastered : 0); };
  const rows = S.board.filter(r => Number.isFinite(+r.mastered)).sort((a, b) => (mf(b) - mf(a)) || ((+b.w || 0) - (+a.w || 0)));
  if (!rows.length) { sheet.append(el("div", { class: "empty" }, "Nobody is on the board yet. Answer a question or finish a game to get on it.")); return sheet; }
  const tbody = el("tbody");
  rows.forEach((r, i) => {
    tbody.append(el("tr", { class: r.id === S.uid ? "me" : null },
      el("td", { class: "num mono" }, i + 1), el("td", {}, cleanNick(r.nick) || "Player"),
      el("td", { class: "num" }, `${mf(r)}/${S.bank.length}`),
      el("td", { class: "num" }, +r.w || 0), el("td", { class: "num" }, +r.l || 0), el("td", { class: "num" }, +r.d || 0)));
  });
  sheet.append(el("div", { class: "tablewrap" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", { class: "num" }, "#"), el("th", {}, "Player"), el("th", { class: "num" }, "Mastered · " + bankInfo(S.subject).name), el("th", { class: "num" }, "W"), el("th", { class: "num" }, "L"), el("th", { class: "num" }, "D"))),
    tbody)));
  sheet.append(el("p", { class: "note", style: "margin-top:10px" }, "Switch subject at the top right to see each subject's standings. Mastered means the last answer to that question was right. W–L–D counts finished games: a win is sole first place in Race or last standing in Bomb."));
  return sheet;
}

/* ---------- routing ---------- */
const VIEWS = ["duel", "practice", "progress", "leaderboard"];
function route() {
  const h = location.hash.replace("#", "");
  S.view = VIEWS.includes(h) ? h : "duel";
  if (S.view === "leaderboard") subscribeBoard();
  render();
}
window.addEventListener("hashchange", route);

/* ---------- boot ---------- */
async function boot() {
  S.nick = cleanNick(lsGet("p1d.nick")) || "Player " + Math.floor(100 + Math.random() * 900);
  try { S.named = sessionStorage.getItem("p1d.named") === "1"; } catch {}
  const nickIn = $("#nick"); nickIn.value = S.nick;
  nickIn.addEventListener("change", () => {
    const v = cleanNick(nickIn.value); if (!v) { nickIn.value = S.nick; return; }
    setNick(v); S.named = true; try { sessionStorage.setItem("p1d.named", "1"); } catch {}
  });
  try {
    const loaded = await Promise.all(BANKS.map(b => fetch(b.file, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(b.file); return r.json(); })));
    BANKS.forEach((b, i) => {
      const data = loaded[i];
      for (const q of data.questions) { q.bk = b.key; S.byId[q.id] = q; }
      S.banks[b.key] = { questions: data.questions, sections: data.sections, constants: data.constants || "" };
    });
    const sel = $("#subject");
    for (const b of BANKS) sel.append(el("option", { value: b.key }, b.name));
    sel.addEventListener("change", () => {
      setSubject(sel.value); lsSet("p1d.subject", S.subject);
      S.prac.topic = "all"; S.prac.qid = null;
      S.form.pool = S.form.mode === "bomb" ? "quick" : "all";
      if (S.view === "leaderboard" || S.view === "progress" || S.view === "practice" || !S.match) render();
    });
    setSubject(lsGet("p1d.subject") || "h2");
  } catch {
    $("#view").replaceChildren(el("div", { class: "sheet" }, el("p", {}, "The question bank couldn't be loaded. Reload the page to try again.")));
    return;
  }
  route();
  const fb = await initFirebase();
  if (!fb) { S.roomState = "off"; await initStore(); return; }
  S.uid = fb.user.uid; S.db = fb.db;
  if (!lsGet("p1d.nick") && fb.user.displayName) {
    const first = cleanNick(fb.user.displayName.split(/\s+/)[0]);
    if (first) { S.nick = first; nickIn.value = first; }
  }
  await initStore();
  initRoom(fb.room);
  if (S.view === "leaderboard") subscribeBoard();
}

/* ---------- Firebase backend ----------
   Presence lives at lobby/<connection id>; Firebase deletes it when the tab disconnects.
   Each presence object is stored as a JSON string, because Firebase drops nulls inside arrays. */
const FB_SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.append(s); });
}
async function initFirebase() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || /PASTE/.test(cfg.apiKey)) { S.setupMissing = true; return null; }
  try {
    if (typeof window.firebase === "undefined") {   // tests inject a fake firebase first
      await loadScript(FB_SDK + "firebase-app-compat.js");
      await Promise.all([loadScript(FB_SDK + "firebase-auth-compat.js"), loadScript(FB_SDK + "firebase-database-compat.js")]);
    }
    firebase.initializeApp(cfg);
    const auth = firebase.auth(), rtdb = firebase.database();
    let user = await new Promise(ok => { const off = auth.onAuthStateChanged(u => { off(); ok(u); }); });
    if (!user) user = (await auth.signInAnonymously()).user;
    setupAccountButton(auth, user);
    return { user, db: makeDb(rtdb), room: makeRoom(rtdb, user.uid) };
  } catch (e) {
    console.error("Firebase failed to start", e);
    return null;
  }
}
function makeDb(rtdb) {
  return {
    doc(path) {
      const ref = rtdb.ref(path);
      return { get: () => ref.get().then(s => ({ exists: s.exists(), data: () => s.val() })), set: body => ref.set(body) };
    },
    collection(path) {
      let q = rtdb.ref(path);
      const api = {
        orderBy(f) { q = q.orderByChild(f); return api; },
        limit(n) { q = q.limitToLast(n); return api; },
        onSnapshot(next, err) {
          const cb = s => { const docs = []; s.forEach(c => { const v = c.val(); docs.push({ id: c.key, data: () => v }); }); next({ docs, metadata: { fromCache: false } }); };
          q.on("value", cb, err);
          return () => q.off("value", cb);
        }
      };
      return api;
    }
  };
}
function makeRoom(rtdb, uid) {
  const lobby = rtdb.ref("lobby"), me = lobby.push();
  let pres = {};
  const write = () => me.set({ by: uid, p: JSON.stringify(pres) });
  rtdb.ref(".info/connected").on("value", s => { if (s.val() === true) me.onDisconnect().remove().then(write).catch(() => {}); });
  return {
    presence(patch) {
      for (const [k, v] of Object.entries(patch)) { if (v === null) delete pres[k]; else pres[k] = v; }
      return write();
    },
    onPeers(fn, onErr) {
      lobby.on("value", s => {
        const peers = [];
        s.forEach(c => {
          const v = c.val() || {}; let p = {};
          try { p = JSON.parse(v.p) || {}; } catch {}
          peers.push({ peer: c.key, by: v.by || null, isMe: v.by === uid, sameTab: c.key === me.key, presence: p });
        });
        if (!peers.some(p => p.sameTab)) peers.push({ peer: me.key, by: uid, isMe: true, sameTab: true, presence: pres });
        fn({ peers });
      }, () => onErr && onErr());
    }
  };
}
function setupAccountButton(auth, user) {
  const b = $("#acct"); b.hidden = false;
  S.google = !user.isAnonymous;
  if (S.google) {
    b.textContent = "Sign out";
    b.title = "Signed in with Google as " + (user.email || user.displayName || "you");
    b.onclick = () => auth.signOut().then(() => location.reload());
  } else {
    b.textContent = "Sync with Google";
    b.title = "Keep your progress across devices";
    b.onclick = async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try { await user.linkWithPopup(provider); location.reload(); }
      catch (e) {
        if (e.code === "auth/credential-already-in-use" && e.credential) { await auth.signInWithCredential(e.credential); location.reload(); }
        else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") { S.lobbyMsg = "Google sign-in failed: " + (e.code || "unknown error"); render(); }
      }
    };
  }
}
boot();
</script>
